<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Радар Дніпро</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #171b22;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #e5e3df;
    }

    /* Верхня панель статистики та фільтрів */
    .info-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.92);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      max-width: 260px;
      width: calc(100% - 32px);
    }
    .info-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .info-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .filter-group {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #2563eb;
      color: #fff;
    }

    /* Кнопка Оновити у правому нижньому кутку */
    .refresh-btn {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.92);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    .refresh-btn:active {
      transform: scale(0.95);
      background: #1e293b;
    }

    /* Спливаюче вікно маркера */
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    .popup-content strong {
      display: block;
      color: #38bdf8;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .popup-content p {
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .popup-time {
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- Верхня панель -->
  <div class="info-card">
    <div class="info-title" id="points-title">Точок: 0</div>
    <div class="info-subtitle">Маркери активні 60 хвилин</div>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">Всі</button>
      <button class="filter-btn" onclick="setFilter('1', this)">Канал 1</button>
      <button class="filter-btn" onclick="setFilter('2', this)">Канал 2</button>
    </div>
  </div>

  <!-- Кнопка оновлення з візуальним відгуком -->
  <button class="refresh-btn" onclick="forceReload(this)">🔄 Оновити</button>

  <!-- Карта -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // URL бази Firebase
    const DB_URL = 'https://dnepr-radar-default-rtdb.europe-west1.firebasedatabase.app/points.json';

    const TTL_MS = 60 * 60 * 1000; // 60 хвилин (1 година)
    let currentFilter = 'all';
    let rawPoints = [];
    const markersLayer = L.layerGroup();

    // Центр карти: фокус на коридор Центр — Вокзал — Парус
    const map = L.map('map', {
      zoomControl: false
    }).setView([48.472, 35.015], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    markersLayer.addTo(map);

    // Функція примусового перезавантаження сторінки з помітним візуальним ефектом
    function forceReload(btn) {
      if (btn) {
        btn.innerHTML = '⏳ Оновлюю...';
        btn.style.pointerEvents = 'none';
      }

      // Затемнення екрану для чіткого візуального підтвердження кліку
      document.body.style.transition = 'opacity 0.15s ease';
