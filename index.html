<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Радар Дніпро</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #171b22;
    }
    #map {
      width: 100%;
      height: 100%;
      background: #e5e3df;
    }

    /* Верхня панель зі статистикою та фільтрами */
    .info-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.94);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      max-width: 270px;
      width: calc(100% - 32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .info-title {
      font-size: 15px;
      font-weight: 700;
    }
    .db-settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .info-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .filter-group {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }

    /* Кнопка Оновити */
    .refresh-btn {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.94);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .refresh-btn:active {
      transform: scale(0.94);
      background: #1e293b;
    }

    /* Повноекранний індикатор завантаження */
    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      gap: 12px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Вікно маркера */
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    .popup-content strong {
      display: block;
      color: #38bdf8;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .popup-content p {
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .popup-time {
      font-size: 11px;
      color: #94a3b8;
    }
    .error-banner {
      color: #f87171;
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Оверлей перезавантаження -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div>Оновлення даних...</div>
  </div>

  <!-- Панель керування -->
  <div class="info-card">
    <div class="info-header">
      <div class="info-title" id="points-title">Точок: 0</div>
      <button class="db-settings-btn" onclick="editDbUrl()" title="Налаштування посилання БД">⚙️</button>
    </div>
    <div class="info-subtitle">Маркери активні 60 хвилин</div>
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">Всі</button>
      <button class="filter-btn" onclick="setFilter('1', this)">Канал 1</button>
      <button class="filter-btn" onclick="setFilter('2', this)">Канал 2</button>
    </div>
    <div id="db-error" class="error-banner" style="display:none;"></div>
  </div>

  <!-- Кнопка оновлення -->
  <button id="refresh-btn" class="refresh-btn" onclick="triggerReload()">🔄 Оновити</button>

  <!-- Карта -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let DB_URL = localStorage.getItem('user_db_url') || 'https://dnepr-radar-default-rtdb.europe-west1.firebasedatabase.app/points.json';

    const TTL_MS = 60 * 60 * 1000; // 60 хвилин
    let currentFilter = 'all';
    let rawPoints = [];
    const markersLayer = L.layerGroup();

    // Центрування: Центр — Вокзал — Парус
    const map = L.map('map', {
      zoomControl: false
    }).setView([48.472, 35.015], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    markersLayer.addTo(map);

    function triggerReload() {
      const overlay = document.getElementById('loading-overlay');
      const btn = document.getElementById('refresh-btn');
      
      btn.innerHTML = '⏳ Оновлюю...';
      btn.style.pointerEvents = 'none';
      overlay.style.display = 'flex';

      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set('t', Date.now());
        window.location.href = url.toString();
      }, 250);
    }

    function editDbUrl() {
      const current = localStorage.getItem('user_db_url') || DB_URL;
      const input = prompt('Введіть повний URL вашої бази Firebase (з /points.json на кінці):', current);
      if (input && input.trim().startsWith('http')) {
        localStorage.setItem('user_db_url', input.trim());
        DB_URL = input.trim();
        triggerReload();
      }
    }

    function parseTimestamp(p) {
      let t = p.timestamp || p.time || p.date;
      if (!t) return Date.now();
      if (typeof t === 'string' && !isNaN(t)) t = Number(t);
      if (typeof t === 'number' && t < 1e11) t *= 1000;
      return new Date(t).getTime() || Date.now();
    }

    function getRelativeTime(timestamp) {
      const diffMins = Math.floor((Date.now() - timestamp) / 60000);
      if (diffMins <= 0) return 'щойно';
      if (diffMins === 1) return '1 хв. тому';
      return `${diffMins} хв. тому`;
    }

    function getMarkerColor(pChannel, type) {
      if (pChannel === '2') {
        return type === 'clear' ? '#eab308' : '#a855f7';
      } else {
        return type === 'clear' ? '#22c55e' : '#ef4444';
      }
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let count = 0;

      rawPoints.forEach(p => {
        if (!p) return;
        const pTime = parseTimestamp(p);
        
        // Фільтр за часом життя
        if (now - pTime > TTL_MS) return;

        // Нормалізація каналу: підтримує 1, '1', 'channel1', null -> '1'
        let pChannel = '1';
        if (p.channel === 2 || p.channel === '2' || p.channel === 'channel2') {
          pChannel = '2';
        }

        // Фільтрація за вкладками
        if (currentFilter !== 'all' && currentFilter !== pChannel) return;

        const lat = parseFloat(p.lat);
        const lng = parseFloat(p.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        const type = p.type || 'danger';
        const color = getMarkerColor(pChannel, type);

        const circle = L.circleMarker([lat, lng], {
          radius: 9,
          fillColor: color,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.85
        });

        // Пошук тексту повідомлення по всіх можливих полях
        const pointText = p.text || p.message || p.description || p.raw_text || p.original_text || p.details || 'Без опису';
        const timeText = getRelativeTime(pTime);

        circle.bindPopup(`
          <div class="popup-content">
            <strong>${p.address || 'Точка на карті'}</strong>
            <p>${pointText}</p>
            <div class="popup-time">🕒 ${timeText} | Канал ${pChannel}</div>
          </div>
        `);

        circle.addTo(markersLayer);
        count++;
      });

      document.getElementById('points-title').innerText = `Точок: ${count}`;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderMarkers();
    }

    async function loadData() {
      const errBox = document.getElementById('db-error');
      try {
        const res = await fetch(`${DB_URL}?nocache=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        rawPoints = data ? Object.values(data) : [];
        errBox.style.display = 'none';
        renderMarkers();
      } catch (err) {
        console.error(err);
        errBox.style.display = 'block';
        errBox.innerHTML = `⚠️ Помилка з'єднання з БД.<br>Натисніть ⚙️ вище і перевірте адресу.`;
      }
    }

    loadData();
  </script>
</body>
</html>
