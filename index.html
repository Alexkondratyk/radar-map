<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радар Дніпро</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --tl-scale: 1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Панель управления */
    .dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 14px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      min-width: 230px;
      transition: all 0.25s ease;
    }
    .dash-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 8px; 
    }
    .points-count { font-size: 15px; font-weight: 700; color: #fff; }
    
    /* Кнопка сворачивания */
    .btn-toggle {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.2s;
    }
    .btn-toggle:hover {
      background: #334155;
      color: #fff;
    }

    .btn-group { display: flex; gap: 6px; }
    .btn-filter {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      flex: 1;
    }
    .btn-filter.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Сворачиваемый блок */
    .collapsible-body {
      margin-top: 8px;
      transition: all 0.25s ease;
    }
    .subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }

    /* Кнопка режима расстановки */
    .btn-setup {
      width: 100%;
      background: #1e293b;
      border: 1px dashed #38bdf8;
      color: #38bdf8;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-setup.editing {
      background: #15803d;
      border: 1px solid #22c55e;
      color: #ffffff;
      animation: pulse-border 1.5s infinite;
    }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Легенда */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .shape { width: 10px; height: 10px; display: inline-block; }
    .shape.circle { border-radius: 50%; }
    .shape.square { border-radius: 2px; }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }
    .dot-blue { background: #06b6d4; }
    .dot-purple { background: #a855f7; }

    /* Светофор с масштабированием зума */
    .traffic-light-body {
      background: #020617;
      border: 2px solid #ffffff;
      border-radius: 14px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.85);
      cursor: pointer;
      width: 18px;
      transform: scale(var(--tl-scale));
      transform-origin: center center;
      transition: transform 0.15s ease-out;
    }
    .traffic-light-body.draggable-mode {
      cursor: grab;
      border-color: #38bdf8;
      box-shadow: 0 0 12px 2px #38bdf8;
    }
    .tl-lamp {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .tl-lamp.red-active {
      background: #ef4444;
      box-shadow: 0 0 10px 3px #ef4444;
    }
    .tl-lamp.red-dim {
      background: #450a0a;
      opacity: 0.3;
    }
    .tl-lamp.green-active {
      background: #22c55e;
      box-shadow: 0 0 10px 3px #22c55e;
    }
    .tl-lamp.green-dim {
      background: #052e16;
      opacity: 0.3;
    }
    .tl-lamp.off {
      background: #334155;
      opacity: 0.4;
    }

    .square-marker-icon, .traffic-marker-icon {
      background: transparent !important;
      border: none !important;
    }

    /* Тост уведомление */
    .toast-msg {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 2000;
      background: #10b981;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Кнопка физического обновления F5 */
    .btn-refresh {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #1e293b; }

    /* Попап */
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 10px !important;
      padding: 4px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #1e293b !important; }
    .popup-title { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-text { font-size: 13px; margin-bottom: 8px; line-height: 1.4; color: #e2e8f0; }
    .popup-meta {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 6px;
      gap: 10px;
    }
    .timer-badge { color: #f59e0b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dash-header">
      <div class="points-count" id="countText">Точок: 0</div>
      <button class="btn-toggle" id="btnToggle" onclick="togglePanelCollapse()" title="Згорнути / Розгорнути">▲</button>
    </div>

    <div class="btn-group">
      <button class="btn-filter active" onclick="setFilter('all', this)">Всі</button>
      <button class="btn-filter" onclick="setFilter('Канал 1', this)">Канал 1</button>
      <button class="btn-filter" onclick="setFilter('Канал 2', this)">Канал 2</button>
    </div>

    <div id="collapsibleBody" class="collapsible-body">
      <div class="subtitle">Маркери активні 40 хвилин</div>

      <button id="btnSetup" class="btn-setup" onclick="toggleEditMode()">
        <span>📍</span><span id="btnSetupText">Розставити світлофори</span>
      </button>

      <div class="legend">
        <div class="legend-row">
          <span class="shape circle dot-green"></span><span class="shape circle dot-red"></span>
          <span>К1 (кружки): Чисто / Опасно</span>
        </div>
        <div class="legend-row">
          <span class="shape square dot-blue"></span><span class="shape square dot-purple"></span>
          <span>К2 (квадрати): Чисто / Опасно</span>
        </div>
        <div class="legend-row" style="margin-top: 3px;">
          <span style="font-size: 13px;">🚦</span>
          <span>Світлофори: Кайдацький, Водолікарня, Комбайновий, Краснозаводська, Павлова, Річпорт, Водокачка</span>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg">✅ Позиції збережено та зафіксовано!</div>
  
  <button class="btn-refresh" onclick="hardReload()">🔄 Оновити</button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const FIREBASE_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/points.json";
    const LIFETIME_MS = 40 * 60 * 1000;

    // Список 7 ключевых светофоров
    const DEFAULT_CHECKPOINTS = [
      {
        id: "kaidak_rovd",
        name: "РОВД / Кайдацький з'їзд",
        lat: 48.4925,
        lng: 34.9625,
        keys: ["кайдак", "ровд", "з'їзд", "съезд"]
      },
      {
        id: "vodolechebnitsa",
        name: "Водолікарня (пр. Свободи, 2)",
        lat: 48.4848,
        lng: 34.9735,
        keys: ["водолечеб", "водолікарн", "свобод"]
      },
      {
        id: "kombainoviy",
        name: "Комбайновий (Белелюбського)",
        lat: 48.4795,
        lng: 34.9845,
        keys: ["комбайн", "ударник"]
      },
      {
        id: "krasnozavodska",
        name: "Краснозаводська (Белелюбського біля ДТРЗ)",
        lat: 48.4812,
        lng: 34.9940,
        keys: ["краснозавод", "белелюб"]
      },
      {
        id: "pavlova",
        name: "вул. Академіка Павлова",
        lat: 48.4818,
        lng: 35.0012,
        keys: ["павлов"]
      },
      {
        id: "rechport",
        name: "Річпорт (Набережна Заводська)",
        lat: 48.4805,
        lng: 35.0210,
        keys: ["речпорт", "річпорт", "десантник", "річковий"]
      },
      {
        id: "vodokachka",
        name: "Водокачка (Набережна Заводська)",
        lat: 48.4910,
        lng: 34.9480,
        keys: ["водокачк"]
      }
    ];

    function hardReload() {
      const url = new URL(window.location.href);
      url.searchParams.set('t', Date.now());
      window.location.href = url.toString();
    }

    function togglePanelCollapse() {
      const body = document.getElementById("collapsibleBody");
      const btn = document.getElementById("btnToggle");
      const isHidden = body.style.display === "none";

      if (isHidden) {
        body.style.display = "block";
        btn.innerText = "▲";
        localStorage.setItem("radar_panel_collapsed", "false");
      } else {
        body.style.display = "none";
        btn.innerText = "▼";
        localStorage.setItem("radar_panel_collapsed", "true");
      }
    }

    if (localStorage.getItem("radar_panel_collapsed") === "true") {
      document.getElementById("collapsibleBody").style.display = "none";
      document.getElementById("btnToggle").innerText = "▼";
    }

    function getStoredPositions() {
      try {
        const saved = localStorage.getItem("dnepr_radar_tl_positions");
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        return {};
      }
    }

    function savePositionToStorage(id, lat, lng) {
      const stored = getStoredPositions();
      stored[id] = { lat: Number(lat), lng: Number(lng) };
      localStorage.setItem("dnepr_radar_tl_positions", JSON.stringify(stored));
    }

    const map = L.map('map', { zoomControl: false }).setView([48.481, 34.985], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    const trafficLightLayer = L.layerGroup().addTo(map);

    let allPoints = [];
    let currentFilter = 'all';
    let isEditMode = false;
    let trafficMarkersMap = {};

    function updateZoomScale() {
      const z = map.getZoom();
      const scale = Math.max(0.5, Math.min(1.5, 1 + (z - 13) * 0.15));
      document.documentElement.style.setProperty('--tl-scale', scale);
    }
    map.on('zoom', updateZoomScale);
    map.on('zoomend', updateZoomScale);
    updateZoomScale();

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById("btnSetup");
      const btnText = document.getElementById("btnSetupText");

      if (isEditMode) {
        btn.classList.add("editing");
        btnText.innerText = "💾 Зафіксувати позиції";
        showToast("📍 Перетягніть світлофори мишкою у потрібні місця!");
      } else {
        btn.classList.remove("editing");
        btnText.innerText = "📍 Розставити світлофори";
        showToast("✅ Позиції надійно збережено та зафіксовано!");
      }

      Object.values(trafficMarkersMap).forEach(marker => {
        if (isEditMode) {
          marker.dragging.enable();
          if (marker._icon) {
            const body = marker._icon.querySelector('.traffic-light-body');
            if (body) body.classList.add('draggable-mode');
          }
        } else {
          marker.dragging.disable();
          if (marker._icon) {
            const body = marker._icon.querySelector('.traffic-light-body');
            if (body) body.classList.remove('draggable-mode');
          }
        }
      });
    }

    function setFilter(type, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = type;
      renderMarkers();
    }

    async function loadPoints() {
      try {
        const res = await fetch(`${FIREBASE_URL}?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data) {
          allPoints = [];
          renderMarkers();
          renderTrafficLights();
          return;
        }

        const now = Date.now();
        allPoints = Object.values(data).filter(p => {
          if (!p || typeof p !== 'object' || !p.lat || !p.lng) return false;
          const time = p.time || p.timestamp || 0;
          return (now - time) <= LIFETIME_MS;
        });

        renderMarkers();
        renderTrafficLights();
      } catch (err) {
        console.error("Помилка завантаження точок:", err);
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI/180;
      const p2 = lat2 * Math.PI/180;
      const dp = (lat2-lat1) * Math.PI/180;
      const dl = (lon2-lon1) * Math.PI/180;
      const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function isCleanPoint(p) {
      if (p.color === "green" || p.color === "blue" || p.status === "чисто") return true;
      if (p.color === "red" || p.color === "purple" || p.status === "опасно") return false;
      const t = (p.text || "").toLowerCase();
      return t.includes("чисто") || t.includes("👍") || t.includes("🫡") || t.includes("пусто");
    }

    function getMarkerColor(p) {
      if (p.color === "green") return "#22c55e";
      if (p.color === "red") return "#ef4444";
      if (p.color === "blue") return "#06b6d4";
      if (p.color === "purple") return "#a855f7";

      const isChannel2 = (p.source === "agendaDnepr" || p.channel_name === "Канал 2");
      const clean = isCleanPoint(p);
      if (isChannel2) return clean ? "#06b6d4" : "#a855f7";
      return clean ? "#22c55e" : "#ef4444";
    }

    function matchesCheckpoint(p) {
      const stored = getStoredPositions();
      const text = (p.text + " " + (p.address || "")).toLowerCase();
      for (const cp of DEFAULT_CHECKPOINTS) {
        const curLat = stored[cp.id] ? stored[cp.id].lat : cp.lat;
        const curLng = stored[cp.id] ? stored[cp.id].lng : cp.lng;
        const dist = getDistanceMeters(p.lat, p.lng, curLat, curLng);
        const matchKey = cp.keys.some(k => text.includes(k));
        if (dist <= 450 || matchKey) return cp;
      }
      return null;
    }

    function renderTrafficLights() {
      const now = Date.now();
      const stored = getStoredPositions();

      DEFAULT_CHECKPOINTS.forEach(cp => {
        const curLat = stored[cp.id] ? stored[cp.id].lat : cp.lat;
        const curLng = stored[cp.id] ? stored[cp.id].lng : cp.lng;

        const matched = allPoints.filter(p => {
          const dist = getDistanceMeters(p.lat, p.lng, curLat, curLng);
          const text = (p.text + " " + (p.address || "")).toLowerCase();
          const matchKey = cp.keys.some(k => text.includes(k));
          return (dist <= 500) || matchKey;
        });

        matched.sort((a, b) => (b.time || b.timestamp || 0) - (a.time || a.timestamp || 0));
        const latest = matched[0];

        let state = "off";
        let redClass = "tl-lamp off";
        let greenClass = "tl-lamp off";
        let statusTitle = "⚪ Немає звітів (черговий режим)";

        if (latest) {
          const clean = isCleanPoint(latest);
          if (clean) {
            state = "clean";
            redClass = "tl-lamp red-dim";
            greenClass = "tl-lamp green-active";
            statusTitle = "🟢 ВІЛЬНО / ЧИСТО";
          } else {
            state = "danger";
            redClass = "tl-lamp red-active";
            greenClass = "tl-lamp green-dim";
            statusTitle = "🔴 УВАГА / НЕБЕЗПЕЧНО (БП/перевірка)";
          }
        }

        const dragClass = isEditMode ? "draggable-mode" : "";
        const iconHtml = `
          <div class="traffic-light-body ${dragClass}" title="${cp.name}">
            <div class="${redClass}"></div>
            <div class="${greenClass}"></div>
          </div>
        `;

        const tlIcon = L.divIcon({
          className: 'traffic-marker-icon',
          html: iconHtml,
          iconSize: [18, 30],
          iconAnchor: [9, 15],
          popupAnchor: [0, -15]
        });

        let popupContent = `
          <div class="popup-title">🚦 Світлофор: ${cp.name}</div>
          <div style="font-size: 13px; font-weight: 700; margin-bottom: 6px; color: ${state === 'clean' ? '#22c55e' : (state === 'danger' ? '#ef4444' : '#94a3b8')}">
            ${statusTitle}
          </div>
        `;

        if (latest) {
          const time = latest.time || latest.timestamp || 0;
          const diff = now - time;
          const remainingMs = Math.max(0, LIFETIME_MS - diff);
          const remMin = Math.floor(remainingMs / 60000);
          const remSec = Math.floor((remainingMs % 60000) / 1000);
          const timeStr = new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          popupContent += `
            <div class="popup-text">${latest.text || ""}</div>
            <div class="popup-meta">
              <span>🕒 ${timeStr} | ${latest.channel_name || (latest.source === "agendaDnepr" ? "Канал 2" : "Канал 1")}</span>
              <span class="timer-badge">⏳ До скидання: ${remMin} хв ${remSec} с</span>
            </div>
          `;
        } else {
          popupContent += `<div class="popup-text" style="color: #94a3b8;">Повідомлень за останні 40 хв не було.</div>`;
        }

        if (trafficMarkersMap[cp.id]) {
          const marker = trafficMarkersMap[cp.id];
          marker.setIcon(tlIcon);
          marker.setPopupContent(popupContent);
          if (!isEditMode) {
            marker.setLatLng([curLat, curLng]);
          }
        } else {
          const marker = L.marker([curLat, curLng], {
            icon: tlIcon,
            zIndexOffset: 1000,
            draggable: isEditMode
          });

          marker.on('dragend', function(e) {
            const pos = e.target.getLatLng();
            savePositionToStorage(cp.id, pos.lat.toFixed(5), pos.lng.toFixed(5));
            showToast(`📌 Збережено позицію для: ${cp.name}`);
            renderMarkers();
          });

          marker.bindPopup(popupContent);
          trafficLightLayer.addLayer(marker);
          trafficMarkersMap[cp.id] = marker;
        }
      });
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let visibleCount = 0;

      allPoints.forEach(p => {
        const time = p.time || p.timestamp || 0;
        const diff = now - time;
        if (diff > LIFETIME_MS) return;

        if (matchesCheckpoint(p)) return;

        const isChannel2 = (p.source === "agendaDnepr" || p.channel_name === "Канал 2");
        const channelTitle = isChannel2 ? "Канал 2" : "Канал 1";

        if (currentFilter !== 'all' && currentFilter !== channelTitle) return;

        const remainingMs = Math.max(0, LIFETIME_MS - diff);
        const remMinutes = Math.floor(remainingMs / 60000);
        const remSeconds = Math.floor((remainingMs % 60000) / 1000);

        const date = new Date(time);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const markerColor = getMarkerColor(p);

        let marker;
        if (isChannel2) {
          const squareIcon = L.divIcon({
            className: 'square-marker-icon',
            html: `<div style="
              width: 14px;
              height: 14px;
              background-color: ${markerColor};
              border: 2px solid #ffffff;
              border-radius: 3px;
              box-shadow: 0 2px 6px rgba(0,0,0,0.45);
            "></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7],
            popupAnchor: [0, -10]
          });
          marker = L.marker([p.lat, p.lng], { icon: squareIcon });
        } else {
          marker = L.circleMarker([p.lat, p.lng], {
            radius: 8,
            fillColor: markerColor,
            color: "#ffffff",
            weight: 2,
            opacity: 1,
            fillOpacity: 0.95
          });
        }

        const popupContent = `
          <div class="popup-title">${p.address || "Дніпро"}</div>
          <div class="popup-text">${p.text || ""}</div>
          <div class="popup-meta">
            <span>🕒 ${timeStr} | ${channelTitle}</span>
            <span class="timer-badge">⏳ До видалення: ${remMinutes} хв ${remSeconds} с</span>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
        visibleCount++;
      });

      document.getElementById('countText').innerText = `Точок: ${visibleCount}`;
    }

    loadPoints();
    setInterval(loadPoints, 15000);
  </script>
</body>
</html>
