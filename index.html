<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радар Дніпро</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Панель управления */
    .dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 12px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      width: 220px;
      transition: all 0.25s ease;
    }
    .dash-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 6px; 
    }
    /* Три клика по счетчику открывают скрытое меню неона */
    .points-count { 
      font-size: 14px; 
      font-weight: 700; 
      color: #fff; 
      cursor: pointer; 
      user-select: none; 
    }
    
    .btn-toggle {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transition: all 0.2s;
    }
    .btn-toggle:hover { background: #334155; color: #fff; }

    .collapsible-body {
      margin-top: 6px;
      transition: all 0.25s ease;
    }
    .subtitle { font-size: 10px; color: #94a3b8; margin-bottom: 8px; }

    .btn-setup {
      width: 100%;
      background: #1e293b;
      border: 1px dashed #38bdf8;
      color: #38bdf8;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-setup.editing {
      background: #15803d;
      border: 1px solid #22c55e;
      color: #ffffff;
      animation: pulse-border 1.5s infinite;
    }

    .btn-secondary {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: #334155; color: #fff; }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Легенда */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 6px;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .shape { 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      display: inline-block; 
      flex-shrink: 0;
      border: 2px solid #facc15;
      box-sizing: border-box;
    }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }

    .legend-time {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px dashed #334155;
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 9px;
    }

    /* СТИЛИ ТОЧЕК-МЕТОК */
    .marker-wrap {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Радарная волна для свежих меток (0-10 мин) */
    .pulse-ring {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      pointer-events: none;
      animation: radar-wave 1.8s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .pulse-green { border: 2px solid #22c55e; box-shadow: 0 0 6px #22c55e; }
    .pulse-red { border: 2px solid #ef4444; box-shadow: 0 0 6px #ef4444; }

    @keyframes radar-wave {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    .radar-core {
      border-radius: 50%;
      box-sizing: border-box;
      transition: all 0.3s ease;
    }

    /* 1. СВЕЖИЕ И АКТУАЛЬНЫЕ (0-25 мин): СПЛОШНЫЕ С ЖЁЛТЫМ ОБОДКОМ */
    .radar-core.fresh, .radar-core.mid {
      border: 2px solid #facc15;
      box-shadow: 0 0 5px rgba(250, 204, 21, 0.6), 0 2px 5px rgba(0,0,0,0.7);
    }
    .radar-core.fresh.green, .radar-core.mid.green { background: #22c55e; }
    .radar-core.fresh.red, .radar-core.mid.red { background: #ef4444; }

    .radar-core.fresh { width: 13px; height: 13px; }
    .radar-core.mid { width: 11px; height: 11px; }

    /* 2. ПРОПАДАЮЩИЕ (25-40 мин): "БУБЛИК" БЕЗ ЖЁЛТОГО ОБОДКА + МЕДЛЕННО МИГАЕТ */
    .radar-core.expiring {
      width: 11px;
      height: 11px;
      background: transparent !important;
      box-shadow: none !important;
      animation: slow-blink 2.2s ease-in-out infinite;
    }
    .radar-core.expiring.green {
      border: 2.5px solid #22c55e !important;
      color: #22c55e;
    }
    .radar-core.expiring.red {
      border: 2.5px solid #ef4444 !important;
      color: #ef4444;
    }

    @keyframes slow-blink {
      0%, 100% {
        opacity: 1;
        filter: drop-shadow(0 0 3px currentColor);
      }
      50% {
        opacity: 0.15;
        filter: none;
      }
    }

    /* Светофор */
    .traffic-light-body {
      background: #020617;
      border: 2px solid #ffffff;
      border-radius: 14px;
      padding: 3px 2px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.85);
      cursor: pointer;
      width: 20px;
      height: 36px;
      user-select: none;
    }
    .traffic-light-body.draggable-mode {
      cursor: grab;
      border-color: #38bdf8;
      box-shadow: 0 0 14px 4px #38bdf8;
    }
    .tl-lamp {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transition: all 0.3s ease;
    }
    .tl-lamp.red-active { background: #ef4444; box-shadow: 0 0 10px 3px #ef4444; }
    .tl-lamp.red-dim { background: #450a0a; opacity: 0.25; }
    .tl-lamp.green-active { background: #22c55e; box-shadow: 0 0 10px 3px #22c55e; }
    .tl-lamp.green-dim { background: #052e16; opacity: 0.25; }
    .tl-lamp.off { background: #334155; opacity: 0.35; }

    .traffic-marker-icon, .custom-point-icon { background: transparent !important; border: none !important; }

    /* Скрытое меню Неона */
    .neon-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1500;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f3ff;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      width: 230px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .neon-title {
      font-size: 13px;
      font-weight: 700;
      color: #00f3ff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .neon-colors {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .btn-color {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #334155;
      cursor: pointer;
    }
    .btn-color.active {
      border-color: #fff;
      box-shadow: 0 0 8px #fff;
    }
    .btn-neon-action {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      border: none;
      transition: all 0.2s;
    }
    .btn-neon-draw { background: #0284c7; color: #fff; }
    .btn-neon-draw.drawing { background: #16a34a; box-shadow: 0 0 10px #22c55e; }
    .btn-neon-undo { background: #334155; color: #cbd5e1; }
    .btn-neon-clear { background: #991b1b; color: #fee2e2; }

    .neon-svg-line {
      pointer-events: none !important;
      filter: drop-shadow(0 0 3px currentColor);
    }

    /* Модальное окно */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      width: 290px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #38bdf8; }
    .modal-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }
    .modal-input:focus { border-color: #38bdf8; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-m {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      border: none;
    }
    .btn-m-save { background: #2563eb; color: #fff; }
    .btn-m-cancel { background: #334155; color: #94a3b8; }

    .toast-msg {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: #10b981;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px) translateX(-50%); }
      to { opacity: 1; transform: translateY(0) translateX(-50%); }
    }

    .btn-refresh {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #1e293b; }

    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 10px !important;
      padding: 4px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #1e293b !important; }
    .popup-title { font-size: 13px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-text { font-size: 12px; margin-bottom: 6px; line-height: 1.4; color: #e2e8f0; }
    .popup-meta {
      font-size: 10px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 5px;
      gap: 8px;
    }
    .timer-badge { color: #f59e0b; font-weight: 600; }
    .btn-delete-tl {
      margin-top: 8px;
      width: 100%;
      background: #991b1b;
      color: #fee2e2;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-delete-tl:hover { background: #dc2626; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dash-header">
      <!-- 3 быстрых клика открывают меню неона -->
      <div class="points-count" id="countText" onclick="handleSecretClick()">Точок: 0</div>
      <button class="btn-toggle" id="btnToggle" onclick="togglePanelCollapse()" title="Згорнути / Розгорнути">▲</button>
    </div>

    <div id="collapsibleBody" class="collapsible-body">
      <div class="subtitle">Мітки активні 40 хв</div>

      <button id="btnSetup" class="btn-setup" onclick="toggleEditMode()">
        <span>📍</span><span id="btnSetupText">Розставити світлофори</span>
      </button>

      <button id="btnToggleTl" class="btn-secondary" onclick="toggleTrafficLights()">
        <span id="btnToggleTlIcon">👁️</span><span id="btnToggleTlText">Сховати світлофори</span>
      </button>

      <button class="btn-secondary" onclick="openAddModal()">
        <span>➕</span><span>Додати світлофор</span>
      </button>

      <div class="legend">
        <div class="legend-row">
          <span class="shape dot-green"></span>
          <span>Вільний проїзд / Чисто</span>
        </div>
        <div class="legend-row">
          <span class="shape dot-red"></span>
          <span>Увага / Блокпост / Патруль</span>
        </div>
        <div class="legend-row" style="margin-top: 2px;">
          <span style="font-size: 11px;">🚦</span>
          <span id="tlLegendCount">Світлофори</span>
        </div>

        <!-- Подсказка по шкале времени -->
        <div class="legend-time">
          <div>💥 <b>Пульсує:</b> 0–10 хв (свіжа, жовтий ободок)</div>
          <div>🟡 <b>Суцільна:</b> 10–25 хв (актуальна, жовтий ободок)</div>
          <div>⭕ <b>Бублик (блимає):</b> 25–40 хв (згасає, без ободка)</div>
        </div>
      </div>
    </div>
  </div>

  <!-- СКРЫТОЕ МЕНЮ НЕОНОВОЙ ПОДСВЕТКИ -->
  <div id="neonPanel" class="neon-panel">
    <div class="neon-title">
      <span>⚡ Неон вулиць</span>
      <span style="cursor:pointer; font-size:14px;" onclick="closeNeonPanel()">✕</span>
    </div>
    <div style="font-size:10px; color:#94a3b8; margin-bottom:6px;">Колір неону:</div>
    <div class="neon-colors">
      <div class="btn-color active" style="background:#00f3ff;" onclick="selectNeonColor('#00f3ff', this)"></div>
      <div class="btn-color" style="background:#22c55e;" onclick="selectNeonColor('#22c55e', this)"></div>
      <div class="btn-color" style="background:#f59e0b;" onclick="selectNeonColor('#f59e0b', this)"></div>
      <div class="btn-color" style="background:#ec4899;" onclick="selectNeonColor('#ec4899', this)"></div>
      <div class="btn-color" style="background:#a855f7;" onclick="selectNeonColor('#a855f7', this)"></div>
    </div>
    <button id="btnNeonDraw" class="btn-neon-action btn-neon-draw" onclick="toggleNeonDrawMode()">✏️ Почати нову лінію</button>
    <button class="btn-neon-action btn-neon-undo" onclick="undoNeonPoint()">↩️ Скасувати точку</button>
    <button class="btn-neon-action btn-neon-undo" onclick="finishCurrentLine()">💾 Зафіксувати лінію</button>
    <button class="btn-neon-action btn-neon-clear" onclick="clearAllNeonLines()">🗑️ Видалити всі лінії</button>
  </div>

  <!-- Модальное окно создания светофора -->
  <div id="modalAdd" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">🚦 Новий світлофор</div>
      <input type="text" id="newTlName" class="modal-input" placeholder="Назва (напр. пр. Богдана Хмельницького)" />
      <input type="text" id="newTlKeys" class="modal-input" placeholder="Ключові слова (через кому: хмельницького, 12 квартал)" />
      <div class="modal-btns">
        <button class="btn-m btn-m-cancel" onclick="closeAddModal()">Скасувати</button>
        <button class="btn-m btn-m-save" onclick="saveNewTrafficLight()">Додати</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg">✅ Збережено!</div>
  
  <button class="btn-refresh" onclick="hardReload()">🔄 Оновити</button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const FIREBASE_POINTS_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/points.json";
    const FIREBASE_CONFIG_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/config/traffic_lights.json";
    const FIREBASE_NEON_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/config/neon_lines.json";
    const LIFETIME_MS = 40 * 60 * 1000;

    let showTrafficLights = localStorage.getItem("radar_tl_visible") !== "false";

    let checkpoints = [
      {
        id: "kaidak_rovd",
        name: "РОВД / Кайдацький з'їзд",
        lat: 48.4925,
        lng: 34.9625,
        keys: ["кайдак", "ровд", "з'їзд з кайдак", "съезд с кайдак"]
      },
      {
        id: "vodolechebnitsa",
        name: "Водолікарня (пр. Свободи)",
        lat: 48.4848,
        lng: 34.9735,
        keys: ["водолечеб", "водолікарн", "пр свободи", "пр. свободи", "проспект свободи"]
      },
      {
        id: "kombainoviy",
        name: "Комбайновий (Белелюбського)",
        lat: 48.4795,
        lng: 34.9845,
        keys: ["комбайн", "ударник"]
      },
      {
        id: "krasnozavodska",
        name: "Краснозаводська (ДТРЗ)",
        lat: 48.4812,
        lng: 34.9940,
        keys: ["краснозавод", "белелюб", "дтрз"]
      },
      {
        id: "pavlova",
        name: "вул. Академіка Павлова",
        lat: 48.4818,
        lng: 35.0012,
        keys: ["павлов"]
      },
      {
        id: "rechport",
        name: "Річпорт (Набережна Заводська)",
        lat: 48.4805,
        lng: 35.0210,
        keys: ["речпорт", "річпорт", "десантник", "річковий вокзал"]
      },
      {
        id: "vodokachka",
        name: "Водокачка (Набережна Заводська)",
        lat: 48.4910,
        lng: 34.9480,
        keys: ["водокачк"]
      },
      {
        id: "stan_550",
        name: "Стан 550 / Набережна Заводська",
        lat: 48.4865,
        lng: 34.9850,
        keys: ["стан 550", "стан550", "стан"]
      }
    ];

    function hardReload() {
      const url = new URL(window.location.href);
      url.searchParams.set('t', Date.now());
      window.location.href = url.toString();
    }

    function togglePanelCollapse() {
      const body = document.getElementById("collapsibleBody");
      const btn = document.getElementById("btnToggle");
      const isHidden = body.style.display === "none";

      if (isHidden) {
        body.style.display = "block";
        btn.innerText = "▲";
        localStorage.setItem("radar_panel_collapsed", "false");
      } else {
        body.style.display = "none";
        btn.innerText = "▼";
        localStorage.setItem("radar_panel_collapsed", "true");
      }
    }

    if (localStorage.getItem("radar_panel_collapsed") === "true") {
      document.getElementById("collapsibleBody").style.display = "none";
      document.getElementById("btnToggle").innerText = "▼";
    }

    function toggleTrafficLights() {
      showTrafficLights = !showTrafficLights;
      localStorage.setItem("radar_tl_visible", showTrafficLights);
      updateTrafficLightsBtnUI();

      if (showTrafficLights) {
        if (!map.hasLayer(trafficLightLayer)) map.addLayer(trafficLightLayer);
        renderTrafficLights();
        showToast("🚦 Світлофори показано!");
      } else {
        trafficLightLayer.clearLayers();
        trafficMarkersMap = {};
        showToast("🙈 Світлофори приховано!");
      }
    }

    function updateTrafficLightsBtnUI() {
      const btnIcon = document.getElementById("btnToggleTlIcon");
      const btnText = document.getElementById("btnToggleTlText");
      if (showTrafficLights) {
        btnIcon.innerText = "👁️";
        btnText.innerText = "Сховати світлофори";
      } else {
        btnIcon.innerText = "🙈";
        btnText.innerText = "Показати світлофори";
      }
    }
    updateTrafficLightsBtnUI();

    async function syncCheckpointsToCloud() {
      localStorage.setItem("dnepr_radar_checkpoints_v2", JSON.stringify(checkpoints));
      try {
        await fetch(FIREBASE_CONFIG_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(checkpoints)
        });
      } catch (e) {}
    }

    async function loadCheckpointsFromCloud() {
      try {
        const local = localStorage.getItem("dnepr_radar_checkpoints_v2");
        if (local) {
          const parsed = JSON.parse(local);
          if (Array.isArray(parsed) && parsed.length > 0) checkpoints = parsed;
        }

        const res = await fetch(`${FIREBASE_CONFIG_URL}?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            checkpoints = data;
            localStorage.setItem("dnepr_radar_checkpoints_v2", JSON.stringify(data));
          }
        }
      } catch (e) {}
      updateLegendCount();
    }

    function updateLegendCount() {
      document.getElementById("tlLegendCount").innerText = `Світлофори (${checkpoints.length})`;
    }

    const isMobile = window.innerWidth < 768;
    const initialZoom = isMobile ? 12 : 13;
    const map = L.map('map', { zoomControl: false }).setView([48.484, 34.985], initialZoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const neonLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const trafficLightLayer = L.layerGroup().addTo(map);

    let allPoints = [];
    let isEditMode = false;
    let trafficMarkersMap = {};

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }

    async function toggleEditMode() {
      if (!showTrafficLights) toggleTrafficLights();

      isEditMode = !isEditMode;
      const btn = document.getElementById("btnSetup");
      const btnText = document.getElementById("btnSetupText");

      if (isEditMode) {
        btn.classList.add("editing");
        btnText.innerText = "💾 Зафіксувати позиції";
        showToast("📍 Перетягніть світлофори мишкою у потрібні місця!");
      } else {
        btn.classList.remove("editing");
        btnText.innerText = "📍 Розставити світлофори";
        await syncCheckpointsToCloud();
        showToast("✅ Позиції збережено та зафіксовано!");
      }

      Object.values(trafficMarkersMap).forEach(marker => {
        if (isEditMode) {
          marker.dragging.enable();
          if (marker._icon) {
            const body = marker._icon.querySelector('.traffic-light-body');
            if (body) body.classList.add('draggable-mode');
          }
        } else {
          marker.dragging.disable();
          if (marker._icon) {
            const body = marker._icon.querySelector('.traffic-light-body');
            if (body) body.classList.remove('draggable-mode');
          }
        }
      });
      renderTrafficLights();
    }

    function openAddModal() {
      document.getElementById("modalAdd").style.display = "flex";
      document.getElementById("newTlName").value = "";
      document.getElementById("newTlKeys").value = "";
    }
    function closeAddModal() {
      document.getElementById("modalAdd").style.display = "none";
    }

    async function saveNewTrafficLight() {
      const name = document.getElementById("newTlName").value.trim();
      const keysRaw = document.getElementById("newTlKeys").value.trim();
      if (!name) {
        alert("Вкажіть назву світлофора!");
        return;
      }
      const keys = keysRaw ? keysRaw.split(",").map(k => k.trim().toLowerCase()).filter(Boolean) : [name.toLowerCase()];
      const center = map.getCenter();

      const newId = "tl_" + Date.now();
      checkpoints.push({
        id: newId,
        name: name,
        lat: Number(center.lat.toFixed(5)),
        lng: Number(center.lng.toFixed(5)),
        keys: keys
      });

      closeAddModal();
      await syncCheckpointsToCloud();
      updateLegendCount();
      if (!showTrafficLights) toggleTrafficLights();
      renderTrafficLights();
      showToast(`🚦 Додано: ${name}!`);
    }

    async function deleteTrafficLight(id) {
      if (!confirm("Видалити цей світлофор?")) return;
      checkpoints = checkpoints.filter(cp => cp.id !== id);
      if (trafficMarkersMap[id]) {
        trafficLightLayer.removeLayer(trafficMarkersMap[id]);
        delete trafficMarkersMap[id];
      }
      await syncCheckpointsToCloud();
      updateLegendCount();
      renderTrafficLights();
      showToast("🗑️ Світлофор видалено!");
    }

    /* НЕОН */
    let secretClickCount = 0;
    let secretClickTimer = null;
    let neonLines = [];
    let currentNeonColor = "#00f3ff";
    let isDrawingNeon = false;
    let tempPoints = [];
    let activeDrawingPolyline = null;

    function handleSecretClick() {
      secretClickCount++;
      clearTimeout(secretClickTimer);
      secretClickTimer = setTimeout(() => { secretClickCount = 0; }, 800);

      if (secretClickCount >= 3) {
        secretClickCount = 0;
        document.getElementById("neonPanel").style.display = "block";
        showToast("⚡ Секретне меню неонової розмітки активовано!");
      }
    }

    function closeNeonPanel() {
      if (isDrawingNeon) toggleNeonDrawMode();
      document.getElementById("neonPanel").style.display = "none";
    }

    function selectNeonColor(color, el) {
      currentNeonColor = color;
      document.querySelectorAll(".btn-color").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
    }

    function toggleNeonDrawMode() {
      isDrawingNeon = !isDrawingNeon;
      const btn = document.getElementById("btnNeonDraw");

      if (isDrawingNeon) {
        tempPoints = [];
        btn.classList.add("drawing");
        btn.innerText = "🛑 Завершити креслення";
        showToast("👆 Клікайте по дорозі для прокладання тонкої неонової лінії!");
      } else {
        btn.classList.remove("drawing");
        btn.innerText = "✏️ Почати нову лінію";
        finishCurrentLine();
      }
    }

    map.on('click', function(e) {
      if (!isDrawingNeon) return;
      const pt = [Number(e.latlng.lat.toFixed(5)), Number(e.latlng.lng.toFixed(5))];
      tempPoints.push(pt);

      if (!activeDrawingPolyline) {
        activeDrawingPolyline = L.polyline(tempPoints, {
          color: currentNeonColor,
          weight: 3,
          opacity: 0.9,
          className: 'neon-svg-line'
        }).addTo(neonLayer);
      } else {
        activeDrawingPolyline.setLatLngs(tempPoints);
      }
    });

    function undoNeonPoint() {
      if (!isDrawingNeon || tempPoints.length === 0) return;
      tempPoints.pop();
      if (activeDrawingPolyline) {
        activeDrawingPolyline.setLatLngs(tempPoints);
      }
    }

    async function finishCurrentLine() {
      if (tempPoints.length > 1) {
        neonLines.push({
          id: "neon_" + Date.now(),
          color: currentNeonColor,
          points: [...tempPoints]
        });
        await saveNeonLines();
        showToast("✅ Неонову лінію надійно збережено!");
      }
      tempPoints = [];
      activeDrawingPolyline = null;
      renderAllNeonLines();
    }

    async function clearAllNeonLines() {
      if (!confirm("Видалити всі неонові лінії з карти?")) return;
      neonLines = [];
      tempPoints = [];
      activeDrawingPolyline = null;
      await saveNeonLines();
      renderAllNeonLines();
      showToast("🗑️ Всі неонові лінії видалено!");
    }

    async function saveNeonLines() {
      localStorage.setItem("dnepr_radar_neon_v1", JSON.stringify(neonLines));
      try {
        await fetch(FIREBASE_NEON_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(neonLines)
        });
      } catch (e) {}
    }

    async function loadNeonLines() {
      try {
        const local = localStorage.getItem("dnepr_radar_neon_v1");
        if (local) neonLines = JSON.parse(local) || [];

        const res = await fetch(`${FIREBASE_NEON_URL}?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            neonLines = data;
            localStorage.setItem("dnepr_radar_neon_v1", JSON.stringify(data));
          }
        }
      } catch (e) {}
      renderAllNeonLines();
    }

    function renderAllNeonLines() {
      neonLayer.clearLayers();
      neonLines.forEach(line => {
        L.polyline(line.points, {
          color: line.color,
          weight: 3,
          opacity: 0.85,
          interactive: false,
          className: 'neon-svg-line'
        }).addTo(neonLayer);
      });
    }

    /* ТОЧКИ И СВЕТОФОРЫ */
    async function loadPoints() {
      try {
        const res = await fetch(`${FIREBASE_POINTS_URL}?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data) {
          allPoints = [];
          renderMarkers();
          renderTrafficLights();
          return;
        }

        const now = Date.now();
        allPoints = Object.values(data).filter(p => {
          if (!p || typeof p !== 'object' || !p.lat || !p.lng) return false;
          const time = p.time || p.timestamp || 0;
          return (now - time) <= LIFETIME_MS;
        });

        renderMarkers();
        renderTrafficLights();
      } catch (err) {}
    }

    function isCleanPoint(p) {
      if (p.color === "green" || p.status === "чисто") return true;
      if (p.color === "red" || p.status === "опасно") return false;
      const t = (p.text || "").toLowerCase();
      return t.includes("чисто") || t.includes("👍") || t.includes("🫡") || t.includes("пусто");
    }

    function checkKeysMatch(text, cp) {
      if (!cp.keys || cp.keys.length === 0) return false;
      return cp.keys.some(k => {
        if (k.length <= 4) {
          const regex = new RegExp(`\\b${k}\\b`, "i");
          return regex.test(text);
        }
        return text.includes(k);
      });
    }

    function getMatchedCheckpointId(p) {
      const text = ((p.raw_text || p.text || "") + " " + (p.address || "")).toLowerCase();
      for (const cp of checkpoints) {
        if (checkKeysMatch(text, cp)) {
          return cp.id;
        }
      }
      return null;
    }

    function renderTrafficLights() {
      if (!showTrafficLights) return;

      const now = Date.now();

      Object.keys(trafficMarkersMap).forEach(id => {
        if (!checkpoints.some(cp => cp.id === id)) {
          trafficLightLayer.removeLayer(trafficMarkersMap[id]);
          delete trafficMarkersMap[id];
        }
      });

      checkpoints.forEach(cp => {
        const matched = allPoints.filter(p => getMatchedCheckpointId(p) === cp.id);
        matched.sort((a, b) => (b.time || b.timestamp || 0) - (a.time || a.timestamp || 0));
        const latest = matched[0];

        let state = "off";
        let redClass = "tl-lamp off";
        let greenClass = "tl-lamp off";
        let statusTitle = "⚪ Немає звітів (черговий режим)";

        if (latest) {
          const clean = isCleanPoint(latest);
          if (clean) {
            state = "clean";
            redClass = "tl-lamp red-dim";
            greenClass = "tl-lamp green-active";
            statusTitle = "🟢 ВІЛЬНО / ЧИСТО";
          } else {
            state = "danger";
            redClass = "tl-lamp red-active";
            greenClass = "tl-lamp green-dim";
            statusTitle = "🔴 УВАГА / НЕБЕЗПЕЧНО (БП/перевірка)";
          }
        }

        const dragClass = isEditMode ? "draggable-mode" : "";
        const iconHtml = `
          <div class="traffic-light-body ${dragClass}" title="${cp.name}">
            <div class="${redClass}"></div>
            <div class="${greenClass}"></div>
          </div>
        `;

        const tlIcon = L.divIcon({
          className: 'traffic-marker-icon',
          html: iconHtml,
          iconSize: [20, 36],
          iconAnchor: [10, 18],
          popupAnchor: [0, -18]
        });

        let popupContent = `
          <div class="popup-title">🚦 Світлофор: ${cp.name}</div>
          <div style="font-size: 13px; font-weight: 700; margin-bottom: 6px; color: ${state === 'clean' ? '#22c55e' : (state === 'danger' ? '#ef4444' : '#94a3b8')}">
            ${statusTitle}
          </div>
        `;

        if (latest) {
          const time = latest.time || latest.timestamp || 0;
          const diff = now - time;
          const remainingMs = Math.max(0, LIFETIME_MS - diff);
          const remMin = Math.floor(remainingMs / 60000);
          const remSec = Math.floor((remainingMs % 60000) / 1000);
          const timeStr = new Date(time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

          popupContent += `
            <div class="popup-text">${latest.text || ""}</div>
            <div class="popup-meta">
              <span>🕒 ${timeStr}</span>
              <span class="timer-badge">⏳ До скидання: ${remMin} хв ${remSec} с</span>
            </div>
          `;
        } else {
          popupContent += `<div class="popup-text" style="color: #94a3b8;">Повідомлень за останні 40 хв не було.</div>`;
        }

        if (isEditMode) {
          popupContent += `<button class="btn-delete-tl" onclick="deleteTrafficLight('${cp.id}')">🗑️ Видалити цей світлофор</button>`;
        }

        if (trafficMarkersMap[cp.id]) {
          const marker = trafficMarkersMap[cp.id];
          marker.setIcon(tlIcon);
          marker.setPopupContent(popupContent);
        } else {
          const marker = L.marker([cp.lat, cp.lng], {
            icon: tlIcon,
            zIndexOffset: 1000,
            draggable: isEditMode
          });

          marker.on('dragend', async function(e) {
            const newPos = e.target.getLatLng();
            cp.lat = Number(newPos.lat.toFixed(5));
            cp.lng = Number(newPos.lng.toFixed(5));
            await syncCheckpointsToCloud();
          });

          marker.bindPopup(popupContent);
          trafficLightLayer.addLayer(marker);
          trafficMarkersMap[cp.id] = marker;
        }
      });
    }

    /* ----------------------------------------------------
       ОТРИСОВКА КРУЖКОВ: СПЛОШНЫЕ С ЖЁЛТЫМ ОБОДКОМ ИЛИ БУБЛИК БЕЗ ОБОДКА
    ---------------------------------------------------- */
    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let visibleCount = 0;

      allPoints.forEach(p => {
        const time = p.time || p.timestamp || 0;
        const diff = now - time;
        if (diff > LIFETIME_MS) return;

        const ageMinutes = diff / 60000;
        const remainingMs = Math.max(0, LIFETIME_MS - diff);
        const remMinutes = Math.floor(remainingMs / 60000);
        const remSeconds = Math.floor((remainingMs % 60000) / 1000);

        const clean = isCleanPoint(p);
        const colorClass = clean ? "green" : "red";

        let ageClass = "mid";
        let pulseHtml = "";

        if (ageMinutes < 10) {
          // 0-10 мин: СВЕЖАЯ (Сплошная с желтым ободком + радарная волна)
          ageClass = "fresh";
          pulseHtml = `<div class="pulse-ring pulse-${colorClass}"></div>`;
        } else if (ageMinutes >= 25) {
          // 25-40 мин: ПРОПАДАЕТ ("БУБЛИК" БЕЗ ЖЕЛТОГО ОБОДКА, МЕДЛЕННО МИГАЕТ)
          ageClass = "expiring";
        } else {
          // 10-25 мин: АКТУАЛЬНАЯ (Сплошная спокойная с желтым ободком)
          ageClass = "mid";
        }

        const iconHtml = `
          <div class="marker-wrap">
            ${pulseHtml}
            <div class="radar-core ${ageClass} ${colorClass}"></div>
          </div>
        `;

        const pointIcon = L.divIcon({
          className: 'custom-point-icon',
          html: iconHtml,
          iconSize: [24, 24],
          iconAnchor: [12, 12],
          popupAnchor: [0, -10]
        });

        const date = new Date(time);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const popupContent = `
          <div class="popup-title">${p.address || "Дніпро"}</div>
          <div class="popup-text">${p.text || ""}</div>
          <div class="popup-meta">
            <span>🕒 ${timeStr} (${Math.floor(ageMinutes)} хв тому)</span>
            <span class="timer-badge">⏳ До видалення: ${remMinutes} хв ${remSeconds} с</span>
          </div>
        `;

        const marker = L.marker([p.lat, p.lng], { icon: pointIcon });
        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
        visibleCount++;
      });

      document.getElementById('countText').innerText = `Точок: ${visibleCount}`;
    }

    loadCheckpointsFromCloud().then(() => {
      loadNeonLines().then(() => {
        loadPoints();
      });
    });
    setInterval(loadPoints, 15000);
  </script>
</body>
</html>
