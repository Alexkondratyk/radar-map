<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radar Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #map { width: 100%; height: 100%; background: #e5e3df; }

    /* Верхняя панель со счетчиком и фильтрами */
    .control-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      max-width: 320px;
      background: rgba(30, 30, 30, 0.92);
      color: #ffffff;
      padding: 12px 14px;
      border-radius: 16px;
      z-index: 1000;
      box-shadow: 0 4px 18px rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
    }
    .info-count {
      font-size: 15px;
      font-weight: 700;
    }
    .info-sub {
      font-size: 11px;
      color: #aaa;
      margin-top: 2px;
      margin-bottom: 10px;
    }

    /* Кнопки переключения каналов */
    .channel-filter {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      flex: 1;
      padding: 6px 4px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #444;
      background: #222;
      color: #ddd;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #007aff;
      color: #fff;
      border-color: #007aff;
    }

    /* Кнопка ручного обновления */
    .refresh-btn {
      position: absolute;
      bottom: 24px;
      right: 18px;
      background: #ffffff;
      color: #1a1a1a;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 1000;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .refresh-btn:active {
      background: #f0f0f0;
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <div class="control-panel">
    <div class="info-count">Точок: <span id="count">0</span></div>
    <div class="info-sub">Маркери активні 20 хвилин</div>
    
    <div class="channel-filter">
      <button class="filter-btn active" onclick="setChannel('all')">Всі</button>
      <button class="filter-btn" id="btn-ch1" onclick="setChannel('channel1')">Канал 1</button>
      <button class="filter-btn" id="btn-ch2" onclick="setChannel('channel2')">Канал 2</button>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadMarkers()">
    🔄 Оновити
  </button>

  <div id="map"></div>

  <script>
    const DB_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/points.json";

    const map = L.map('map', { zoomControl: false }).setView([48.4647, 35.0462], 12);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    let currentChannel = 'all';
    let cachedPoints = [];

    function setChannel(channel) {
      currentChannel = channel;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      if (channel === 'all') document.querySelectorAll('.filter-btn')[0].classList.add('active');
      if (channel === 'channel1') document.getElementById('btn-ch1').classList.add('active');
      if (channel === 'channel2') document.getElementById('btn-ch2').classList.add('active');
      renderMarkers();
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      const TTL_MS = 20 * 60 * 1000;
      let activeCount = 0;

      cachedPoints.forEach(point => {
        if (!point || !point.lat || !point.lng || !point.time) return;
        if (now - point.time > TTL_MS) return;

        // Фильтрация по каналу
        if (currentChannel !== 'all' && point.channel !== currentChannel) return;

        activeCount++;

        // Цвет маркера в зависимости от источника: Канал 1 — красный, Канал 2 — синий
        let markerColor = point.channel === 'channel2' ? '#007aff' : '#ff3b30';

        const circle = L.circleMarker([point.lat, point.lng], {
          radius: 9,
          fillColor: markerColor,
          color: '#ffffff',
          weight: 2,
          opacity: 1,
          fillOpacity: 0.9
        });

        const minutesAgo = Math.floor((now - point.time) / 60000);
        const sourceName = point.channel === 'channel2' ? 'Канал 2' : 'Канал 1';

        circle.bindPopup(`
          <div style="font-size: 13px;">
            <b style="color:${markerColor}">${sourceName}</b><br>
            <b>${point.address || 'Адреса'}</b><br>
            <span>${point.text || ''}</span><br>
            <small style="color: #666;">${minutesAgo} хв тому</small>
          </div>
        `);

        markersLayer.addLayer(circle);
      });

      document.getElementById('count').innerText = activeCount;
    }

    async function loadMarkers() {
      try {
        const response = await fetch(DB_URL);
        const data = await response.json();
        cachedPoints = data ? Object.values(data) : [];
        renderMarkers();
      } catch (err) {
        console.error("Помилка завантаження точок:", err);
      }
    }

    loadMarkers();
    setInterval(loadMarkers, 60000);
  </script>
</body>
</html>
