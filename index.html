<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="color-scheme" content="light only">
  <title>Радар Дніпро</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* ==============================================================
       🎨 БЛОК НАСТРОЙКИ ЦВЕТОВ И ОБОДКОВ (МЕНЯЙТЕ ЗДЕСЬ)
       ============================================================== */
    :root {
      color-scheme: light only;
      supported-color-schemes: light;

      /* ЗЕЛЕНЫЙ (САЛАТОВЫЙ) ШАРИК */
      --color-green: #25d366;          /* Салатовый цвет заливки */
      --border-green-color: #ffffff;   /* БЕЛЫЙ цвет ободка */
      --border-green-size: 2.5px;      /* Толщина белого ободка */

      /* КРАСНЫЙ (АЛЫЙ) ШАРИК */
      --color-red: #ff334b;            /* Ярко-алый цвет заливки */
      --border-red-color: #ffffff;     /* БЕЛЫЙ цвет ободка */
      --border-red-size: 2.5px;        /* Толщина ободка */
    }
    /* ============================================================== */

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Панель управления */
    .dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 12px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      width: 215px;
      transition: all 0.25s ease;
    }
    .dash-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 6px; 
    }
    .points-count { 
      font-size: 14px; 
      font-weight: 700; 
      color: #fff; 
      cursor: pointer; 
      user-select: none; 
    }
    
    .btn-toggle {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      width: 22px;
      height: 22px;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      transition: all 0.2s;
    }
    .btn-toggle:hover { background: #334155; color: #fff; }

    .collapsible-body {
      margin-top: 6px;
      transition: all 0.25s ease;
    }
    .subtitle { font-size: 10px; color: #94a3b8; margin-bottom: 8px; }

    .btn-setup {
      width: 100%;
      background: #1e293b;
      border: 1px dashed #38bdf8;
      color: #38bdf8;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-setup.editing {
      background: #15803d;
      border: 1px solid var(--color-green);
      color: #ffffff;
      animation: pulse-border 1.5s infinite;
    }

    .btn-secondary {
      width: 100%;
      background: #1e293b;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: #334155; color: #fff; }

    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(37, 211, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
    }

    /* Легенда */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 10px;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 6px;
    }
    .legend-row { display: flex; align-items: center; gap: 7px; }
    .shape { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; border: 1.5px solid #fff; }
    .dot-green { background: var(--color-green); }
    .dot-red { background: var(--color-red); }

    /* ТОЧКИ НА КАРТЕ */
    .custom-dot-marker {
      background: transparent !important;
      border: none !important;
      overflow: visible !important;
    }
    .radar-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
    }
    
    /* ЗЕЛЕНЫЙ ШАРИК С БЕЛЫМ ОБОДКОМ + СВЕРХСИЛЬНЫЙ КОНТРАСТ ОТ ЗАТЕМНЕНИЙ */
    .radar-circle.color-green {
      background: var(--color-green) !important;
      background-image: linear-gradient(var(--color-green), var(--color-green)) !important; /* Обход принудительной темной темы */
      border: var(--border-green-size) solid var(--border-green-color) !important;
      /* box-shadow с внешней темной тенью 1px: делает белый ободок четко видимым и не дает браузеру его стереть */
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 2px 5px rgba(0,0,0,0.4) !important;
    }

    /* КРАСНЫЙ ШАРИК С БЕЛЫМ ОБОДКОМ + КОНТРАСТ */
    .radar-circle.color-red {
      background: var(--color-red) !important;
      background-image: linear-gradient(var(--color-red), var(--color-red)) !important;
      border: var(--border-red-size) solid var(--border-red-color) !important;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 2px 5px rgba(0,0,0,0.4) !important;
    }

    /* Пульсирующее кольцо свежих меток (без затемнений) */
    .radar-circle.fresh.color-green::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      border: 2px solid var(--color-green);
      animation: ripple-ring-green 1.8s infinite ease-out;
      pointer-events: none;
    }
    .radar-circle.fresh.color-red::after {
      content: '';
      position: absolute;
      top: -3px; left: -3px; right: -3px; bottom: -3px;
      border-radius: 50%;
      border: 2px solid var(--color-red);
      animation: ripple-ring-red 1.8s infinite ease-out;
      pointer-events: none;
    }

    @keyframes ripple-ring-green {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes ripple-ring-red {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }

    /* СВЕТОФОРЫ: КРУПНЫЙ УДОБНЫЙ РАЗМЕР (20x36 px) */
    .traffic-pill {
      background: #0f172a !important;
      border: 1.5px solid #ffffff !important;
      border-radius: 13px !important;
      padding: 3px 2px !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 3px !important;
      box-shadow: 0 3px 12px rgba(0,0,0,0.45) !important;
      width: 20px !important;
      height: 36px !important;
      user-select: none !important;
    }
    .traffic-pill.draggable-mode {
      cursor: grab;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 14px 4px #38bdf8 !important;
    }
    .traffic-pill.standby-mode {
      background: rgba(15, 23, 42, 0.45) !important;
      border: 1.5px dashed #94a3b8 !important;
      opacity: 0.7;
    }
    .tl-lamp {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      transition: all 0.25s ease;
    }
    .tl-lamp.red-active { 
      background: var(--color-red) !important; 
      box-shadow: 0 0 10px 3px var(--color-red) !important; 
    }
    .tl-lamp.red-dim { 
      background: #3b1114 !important; 
      opacity: 0.25 !important; 
    }
    .tl-lamp.green-active { 
      background: var(--color-green) !important; 
      box-shadow: 0 0 10px 3px var(--color-green) !important; 
    }
    .tl-lamp.green-dim { 
      background: #092e16 !important; 
      opacity: 0.25 !important; 
    }
    .tl-lamp.off { 
      background: #334155 !important; 
      opacity: 0.4 !important; 
    }

    .traffic-marker-icon { background: transparent !important; border: none !important; }

    /* Скрытое меню Неона */
    .neon-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 1500;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #00f3ff;
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      width: 230px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.35);
      display: none;
      animation: fadeIn 0.25s ease;
    }
    .neon-title {
      font-size: 13px;
      font-weight: 700;
      color: #00f3ff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .neon-colors { display: flex; gap: 6px; margin-bottom: 10px; }
    .btn-color { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #334155; cursor: pointer; }
    .btn-color.active { border-color: #fff; box-shadow: 0 0 8px #fff; }
    .btn-neon-action {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
      border: none;
      transition: all 0.2s;
    }
    .btn-neon-draw { background: #0284c7; color: #fff; }
    .btn-neon-draw.drawing { background: #16a34a; box-shadow: 0 0 10px var(--color-green); }
    .btn-neon-undo { background: #334155; color: #cbd5e1; }
    .btn-neon-clear { background: #991b1b; color: #fee2e2; }

    .neon-svg-line {
      pointer-events: none !important;
      filter: drop-shadow(0 0 4px currentColor);
    }

    /* Модальное окно создания светофора */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: #1e293b;
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      width: 290px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      border: 1px solid #334155;
    }
    .modal-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; color: #38bdf8; }
    .modal-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }
    .modal-input:focus { border-color: #38bdf8; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .btn-m {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
      border: none;
    }
    .btn-m-save { background: #2563eb; color: #fff; }
    .btn-m-cancel { background: #334155; color: #94a3b8; }

    .toast-msg {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      background: #10b981;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px) translateX(-50%); }
      to { opacity: 1; transform: translateY(0) translateX(-50%); }
    }

    .btn-refresh {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    .btn-refresh:hover { background: #1e293b; }

    /* Попап карточка */
    .leaflet-popup-content-wrapper {
      background: #ffffff !important;
      color: #0f172a !important;
      border-radius: 12px !important;
      padding: 4px !important;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2) !important;
    }
    .leaflet-popup-tip { background: #ffffff !important; }
    .popup-card { padding: 4px; }
    .popup-text { font-size: 13px; font-weight: 600; line-height: 1.45; color: #1e293b; margin-bottom: 8px; }
    .popup-meta-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
    }
    .popup-badge {
      background: #f1f5f9;
      color: #334155;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
    }
    .btn-delete-tl {
      margin-top: 8px;
      width: 100%;
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Кнопки управления, легенда и прочий интерфейс ниже остаются полностью прежними... -->
  <div class="dashboard">
    <div class="dash-header">
      <div class="points-count" id="countText" onclick="handleSecretClick()">Точок: 0</div>
      <button class="btn-toggle" id="btnToggle" onclick="togglePanelCollapse()" title="Згорнути / Розгорнути">▲</button>
    </div>

    <div id="collapsibleBody" class="collapsible-body">
      <div class="subtitle">Свіжі пульсують (до 10 хв)</div>

      <button id="btnSetup" class="btn-setup" onclick="toggleEditMode()">
        <span>📍</span><span id="btnSetupText">Розставити світлофори</span>
      </button>

      <button id="btnToggleTl" class="btn-secondary" onclick="toggleTrafficLights()">
        <span id="btnToggleTlIcon">👁️</span><span id="btnToggleTlText">Сховати світлофори</span>
      </button>

      <button class="btn-secondary" onclick="openAddModal()">
        <span>➕</span><span>Додати світлофор</span>
      </button>

      <div class="legend">
        <div class="legend-row">
          <span class="shape dot-green"></span>
          <span>Вільний проїзд / Чисто</span>
        </div>
        <div class="legend-row">
          <span class="shape dot-red"></span>
          <span>Увага / Блокпост / Патруль</span>
        </div>
        <div class="legend-row" style="margin-top: 2px;">
          <span style="font-size: 11px;">🚦</span>
          <span id="tlLegendCount">Світлофори (активні)</span>
        </div>
      </div>
    </div>
  </div>

  <div id="neonPanel" class="neon-panel">
    <div class="neon-title">
      <span>⚡ Неон вулиць</span>
      <span style="cursor:pointer; font-size:14px;" onclick="closeNeonPanel()">✕</span>
    </div>
    <div style="font-size:10px; color:#94a3b8; margin-bottom:6px;">Колір неону:</div>
    <div class="neon-colors">
      <div class="btn-color active" style="background:#00f3ff;" onclick="selectNeonColor('#00f3ff', this)"></div>
      <div class="btn-color" style="background:#25d366;" onclick="selectNeonColor('#25d366', this)"></div>
      <div class="btn-color" style="background:#f59e0b;" onclick="selectNeonColor('#f59e0b', this)"></div>
      <div class="btn-color" style="background:#ec4899;" onclick="selectNeonColor('#ec4899', this)"></div>
      <div class="btn-color" style="background:#a855f7;" onclick="selectNeonColor('#a855f7', this)"></div>
    </div>
    <button id="btnNeonDraw" class="btn-neon-action btn-neon-draw" onclick="toggleNeonDrawMode()">✏️ Почати нову лінію</button>
    <button class="btn-neon-action btn-neon-undo" onclick="undoNeonPoint()">↩️ Скасувати точку</button>
    <button class="btn-neon-action btn-neon-undo" onclick="finishCurrentLine()">💾 Зафіксувати лінію</button>
    <button class="btn-neon-action btn-neon-clear" onclick="clearAllNeonLines()">🗑️ Видалити всі лінії</button>
  </div>

  <div id="modalAdd" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">🚦 Новий світлофор</div>
      <input type="text" id="newTlName" class="modal-input" placeholder="Назва (напр. пр. Богдана Хмельницького)" />
      <input type="text" id="newTlKeys" class="modal-input" placeholder="Ключові слова (через кому: хмельницького, 12 квартал)" />
      <div class="modal-btns">
        <button class="btn-m btn-m-cancel" onclick="closeAddModal()">Скасувати</button>
        <button class="btn-m btn-m-save" onclick="saveNewTrafficLight()">Додати</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast-msg">✅ Збережено!</div>
  
  <button class="btn-refresh" onclick="hardReload()">🔄 Оновити</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const FIREBASE_POINTS_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/points.json";
    const FIREBASE_CONFIG_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/config/traffic_lights.json";
    const FIREBASE_NEON_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/config/neon_lines.json";
    
    const LIFETIME_MS = 40 * 60 * 1000;
    const FRESH_THRESHOLD_MS = 10 * 60 * 1000;

    let showTrafficLights = localStorage.getItem("radar_tl_visible") !== "false";

    let checkpoints = [
      {
        id: "kaidak_rovd",
        name: "РОВД / Кайдацький з'їзд",
        lat: 48.4925,
        lng: 34.9625,
        keys: ["кайдак", "ровд", "з'їзд з кайдак", "съезд с кайдак"]
      },
      {
        id: "vodolechebnitsa",
        name: "Водолікарня (пр. Свободи)",
        lat: 48.4848,
        lng: 34.9735,
        keys: ["водолечеб", "водолікарн", "пр свободи", "пр. свободи", "проспект свободи"]
      },
      {
        id: "kombainoviy",
        name: "Комбайновий (Белелюбського)",
        lat: 48.4795,
        lng: 34.9845,
        keys: ["комбайн", "ударник"]
      },
      {
        id: "krasnozavodska",
        name: "Краснозаводська (ДТРЗ)",
        lat: 48.4812,
        lng: 34.9940,
        keys: ["краснозавод", "белелюб", "дтрз"]
      },
      {
        id: "pavlova",
        name: "вул. Академіка Павлова",
        lat: 48.4818,
        lng: 35.0012,
        keys: ["павлов"]
      },
      {
        id: "rechport",
        name: "Річпорт (Набережна Заводська)",
        lat: 48.4805,
        lng: 35.0210,
        keys: ["речпорт", "річпорт", "десантник", "річковий вокзал"]
      },
      {
        id: "vodokachka",
        name: "Водокачка (Набережна Заводська)",
        lat: 48.4910,
        lng: 34.9480,
        keys: ["водокачк"]
      },
      {
        id: "stan_550",
        name: "Стан 550 / Набережна Заводська",
        lat: 48.4865,
        lng: 34.9850,
        keys: ["стан 550", "стан550", "стан"]
      }
    ];

    function hardReload() {
      const cleanUrl = window.location.origin + window.location.pathname;
      window.location.href = cleanUrl + '?v=' + Date.now();
    }

    function togglePanelCollapse() {
      const body = document.getElementById("collapsibleBody");
      const btn = document.getElementById("btnToggle");
      const isHidden = body.style.display === "none";

      if (isHidden) {
        body.style.display = "block";
        btn.innerText = "▲";
        localStorage.setItem("radar_panel_collapsed", "false");
      } else {
        body.style.display = "none";
        btn.innerText = "▼";
        localStorage.setItem("radar_panel_collapsed", "true");
      }
    }

    if (localStorage.getItem("radar_panel_collapsed") === "true") {
      document.getElementById("collapsibleBody").style.display = "none";
      document.getElementById("btnToggle").innerText = "▼";
    }

    function toggleTrafficLights() {
      showTrafficLights = !showTrafficLights;
      localStorage.setItem("radar_tl_visible", showTrafficLights);
      updateTrafficLightsBtnUI();

      if (showTrafficLights) {
        if (!map.hasLayer(trafficLightLayer)) map.addLayer(trafficLightLayer);
        renderTrafficLights();
        showToast("🚦 Світлофори увімкнено!");
      } else {
        trafficLightLayer.clearLayers();
        trafficMarkersMap = {};
        showToast("🙈 Світлофори приховано!");
      }
    }

    function updateTrafficLightsBtnUI() {
      const btnIcon = document.getElementById("btnToggleTlIcon");
      const btnText = document.getElementById("btnToggleTlText");
      if (showTrafficLights) {
        btnIcon.innerText = "👁️";
        btnText.innerText = "Сховати світлофори";
      } else {
        btnIcon.innerText = "🙈";
        btnText.innerText = "Показати світлофори";
      }
    }
    updateTrafficLightsBtnUI();

    async function syncCheckpointsToCloud() {
      localStorage.setItem("dnepr_radar_checkpoints_v2", JSON.stringify(checkpoints));
      try {
        await fetch(FIREBASE_CONFIG_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(checkpoints)
        });
      } catch (e) {}
    }

    async function loadCheckpointsFromCloud() {
      try {
        const local = localStorage.getItem("dnepr_radar_checkpoints_v2");
        if (local) {
          const parsed = JSON.parse(local);
          if (Array.isArray(parsed) && parsed.length > 0) checkpoints = parsed;
        }

        const res = await fetch(`${FIREBASE_CONFIG_URL}?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            checkpoints = data;
            localStorage.setItem("dnepr_radar_checkpoints_v2", JSON.stringify(data));
          }
        }
      } catch (e) {}
      updateLegendCount();
    }

    function updateLegendCount() {
      document.getElementById("tlLegendCount").innerText = `Світлофори (активні)`;
    }

    const isMobile = window.innerWidth < 768;
    const initialZoom = isMobile ? 12 : 13;
    const map = L.map('map', { zoomControl: false }).setView([48.484, 34.985], initialZoom);

    // ОРИГИНАЛЬНАЯ КАРТА OPENSTREETMAP
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const neonLayer = L.layerGroup().addTo(map);
    const markersLayer = L.layerGroup().addTo(map);
    const trafficLightLayer = L.layerGroup().addTo(map);

    let allPoints = [];
    let isEditMode = false;
    let trafficMarkersMap = {};

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3000);
    }

    async function toggleEditMode() {
      if (!showTrafficLights) toggleTrafficLights();

      isEditMode = !isEditMode;
      const btn = document.getElementById("btnSetup");
      const btnText = document.getElementById("btnSetupText");

      if (isEditMode) {
        btn.classList.add("editing");
        btnText.innerText = "💾 Зафіксувати позиції";
        showToast("📍 Всі світлофори показано! Перетягуйте їх мишкою.");
      } else {
        btn.classList.remove("editing");
        btnText.innerText = "📍 Розставити світлофори";
        await syncCheckpointsToCloud();
        showToast("✅ Позиції збережено та зафіксовано!");
      }

      renderTrafficLights();
    }

    function openAddModal() {
      document.getElementById("modalAdd").style.display = "flex";
      document.getElementById("newTlName").value = "";
      document.getElementById("newTlKeys").value = "";
    }
    function closeAddModal() {
      document.getElementById("modalAdd").style.display = "none";
    }

    async function saveNewTrafficLight() {
      const name = document.getElementById("newTlName").value.trim();
      const keysRaw = document.getElementById("newTlKeys").value.trim();
      if (!name) {
        alert("Вкажіть назву світлофора!");
        return;
      }
      const keys = keysRaw ? keysRaw.split(",").map(k => k.trim().toLowerCase()).filter(Boolean) : [name.toLowerCase()];
      const center = map.getCenter();

      const newId = "tl_" + Date.now();
      checkpoints.push({
        id: newId,
        name: name,
        lat: Number(center.lat.toFixed(5)),
        lng: Number(center.lng.toFixed(5)),
        keys: keys
      });

      closeAddModal();
      await syncCheckpointsToCloud();
      updateLegendCount();
      if (!showTrafficLights) toggleTrafficLights();
      renderTrafficLights();
      showToast(`🚦 Додано: ${name}!`);
    }

    async function deleteTrafficLight(id) {
      if (!confirm("Видалити цей світлофор?")) return;
      checkpoints = checkpoints.filter(cp => cp.id !== id);
      if (trafficMarkersMap[id]) {
        trafficLightLayer.removeLayer(trafficMarkersMap[id]);
        delete trafficMarkersMap[id];
      }
      await syncCheckpointsToCloud();
      updateLegendCount();
      renderTrafficLights();
      showToast("🗑️ Світлофор видалено!");
    }

    /* НЕОНОВАЯ РАЗМЕТКА */
    let secretClickCount = 0;
    let secretClickTimer = null;
    let neonLines = [];
    let currentNeonColor = "#00f3ff";
    let isDrawingNeon = false;
    let tempPoints = [];
    let activeDrawingPolyline = null;

    function handleSecretClick() {
      secretClickCount++;
      clearTimeout(secretClickTimer);
      secretClickTimer = setTimeout(() => { secretClickCount = 0; }, 800);

      if (secretClickCount >= 3) {
        secretClickCount = 0;
        document.getElementById("neonPanel").style.display = "block";
        showToast("⚡ Секретне меню неону активовано!");
      }
    }

    function closeNeonPanel() {
      if (isDrawingNeon) toggleNeonDrawMode();
      document.getElementById("neonPanel").style.display = "none";
    }

    function selectNeonColor(color, el) {
      currentNeonColor = color;
      document.querySelectorAll(".btn-color").forEach(b => b.classList.remove("active"));
      el.classList.add("active");
    }

    function toggleNeonDrawMode() {
      isDrawingNeon = !isDrawingNeon;
      const btn = document.getElementById("btnNeonDraw");

      if (isDrawingNeon) {
        tempPoints = [];
        btn.classList.add("drawing");
        btn.innerText = "🛑 Завершити креслення";
        showToast("👆 Клікайте по дорозі для неонової лінії!");
      } else {
        btn.classList.remove("drawing");
        btn.innerText = "✏️ Почати нову лінію";
        finishCurrentLine();
      }
    }

    map.on('click', function(e) {
      if (!isDrawingNeon) return;
      const pt = [Number(e.latlng.lat.toFixed(5)), Number(e.latlng.lng.toFixed(5))];
      tempPoints.push(pt);

      if (!activeDrawingPolyline) {
        activeDrawingPolyline = L.polyline(tempPoints, {
          color: currentNeonColor,
          weight: 3,
          opacity: 0.9,
          className: 'neon-svg-line'
        }).addTo(neonLayer);
      } else {
        activeDrawingPolyline.setLatLngs(tempPoints);
      }
    });

    function undoNeonPoint() {
      if (!isDrawingNeon || tempPoints.length === 0) return;
      tempPoints.pop();
      if (activeDrawingPolyline) {
        activeDrawingPolyline.setLatLngs(tempPoints);
      }
    }

    async function finishCurrentLine() {
      if (tempPoints.length > 1) {
        neonLines.push({
          id: "neon_" + Date.now(),
          color: currentNeonColor,
          points: [...tempPoints]
        });
        await saveNeonLines();
        showToast("✅ Неонову лінію зафіксовано!");
      }
      tempPoints = [];
      activeDrawingPolyline = null;
      renderAllNeonLines();
    }

    async function clearAllNeonLines() {
      if (!confirm("Видалити всі неонові лінії з карти?")) return;
      neonLines = [];
      tempPoints = [];
      activeDrawingPolyline = null;
      await saveNeonLines();
      renderAllNeonLines();
      showToast("🗑️ Всі неонові лінії видалено!");
    }

    async function saveNeonLines() {
      localStorage.setItem("dnepr_radar_neon_v1", JSON.stringify(neonLines));
      try {
        await fetch(FIREBASE_NEON_URL, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(neonLines)
        });
      } catch (e) {}
    }

    async function loadNeonLines() {
      try {
        const local = localStorage.getItem("dnepr_radar_neon_v1");
        if (local) neonLines = JSON.parse(local) || [];

        const res = await fetch(`${FIREBASE_NEON_URL}?t=${Date.now()}`);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data)) {
            neonLines = data;
            localStorage.setItem("dnepr_radar_neon_v1", JSON.stringify(data));
          }
        }
      } catch (e) {}
      renderAllNeonLines();
    }

    function renderAllNeonLines() {
      neonLayer.clearLayers();
      neonLines.forEach(line => {
        L.polyline(line.points, {
          color: line.color,
          weight: 3,
          opacity: 0.85,
          interactive: false,
          className: 'neon-svg-line'
        }).addTo(neonLayer);
      });
    }

    /* ТОЧКИ И СВЕТОФОРЫ */
    async function loadPoints() {
      try {
        const res = await fetch(`${FIREBASE_POINTS_URL}?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data) {
          allPoints = [];
          renderMarkers();
          renderTrafficLights();
          return;
        }

        const now = Date.now();
        allPoints = Object.values(data).filter(p => {
          if (!p || typeof p !== 'object' || !p.lat || !p.lng) return false;
          const time = p.time || p.timestamp || 0;
          return (now - time) <= LIFETIME_MS;
        });

        renderMarkers();
        renderTrafficLights();
      } catch (err) {}
    }

    function isCleanPoint(p) {
      if (p.color === "green" || p.status === "чисто") return true;
      if (p.color === "red" || p.status === "опасно") return false;
      const t = (p.text || "").toLowerCase();
      return t.includes("чисто") || t.includes("👍") || t.includes("🫡") || t.includes("пусто");
    }

    function checkKeysMatch(text, cp) {
      if (!cp.keys || cp.keys.length === 0) return false;
      return cp.keys.some(k => {
        if (k.length <= 4) {
          const regex = new RegExp(`\\b${k}\\b`, "i");
          return regex.test(text);
        }
        return text.includes(k);
      });
    }

    function getMatchedCheckpointId(p) {
      const text = ((p.raw_text || p.text || "") + " " + (p.address || "")).toLowerCase();
      for (const cp of checkpoints) {
        if (checkKeysMatch(text, cp)) {
          return cp.id;
        }
      }
      return null;
    }

    /* СВЕТОФОРЫ: НЕАКТИВНЫЕ СКРЫТЫ НА 100% */
    function renderTrafficLights() {
      if (!showTrafficLights) return;

      const now = Date.now();

      checkpoints.forEach(cp => {
        const matched = allPoints.filter(p => getMatchedCheckpointId(p) === cp.id);
        matched.sort((a, b) => (b.time || b.timestamp || 0) - (a.time || a.timestamp || 0));
        const latest = matched[0];

        // ЕСЛИ НЕТ АКТИВНОГО ОТЧЁТА И НЕ РЕЖИМ РАССТАНОВКИ — ПОЛНОСТЬЮ СКРЫВАЕМ!
        if (!latest && !isEditMode) {
          if (trafficMarkersMap[cp.id]) {
            trafficLightLayer.removeLayer(trafficMarkersMap[cp.id]);
            delete trafficMarkersMap[cp.id];
          }
          return;
        }

        let state = "off";
        let redClass = "tl-lamp off";
        let greenClass = "tl-lamp off";
        let statusTitle = "⚪ Очікування звітів";

        if (latest) {
          const clean = isCleanPoint(latest);
          if (clean) {
            state = "clean";
            redClass = "tl-lamp red-dim";
            greenClass = "tl-lamp green-active";
            statusTitle = "🟢 ВІЛЬНО / ЧИСТО";
          } else {
            state = "danger";
            redClass = "tl-lamp red-active";
            greenClass = "tl-lamp green-dim";
            statusTitle = "🔴 УВАГА / НЕБЕЗПЕЧНО";
          }
        }

        const dragClass = isEditMode ? "draggable-mode" : "";
        const standbyClass = (!latest && isEditMode) ? "standby-mode" : "";

        const iconHtml = `
          <div class="traffic-pill ${dragClass} ${standbyClass}" title="${cp.name}">
            <div class="${redClass}"></div>
            <div class="${greenClass}"></div>
          </div>
        `;

        const tlIcon = L.divIcon({
          className: 'traffic-marker-icon',
          html: iconHtml,
          iconSize: [20, 36],
          iconAnchor: [10, 18],
          popupAnchor: [0, -18]
        });

        let popupContent = `
          <div style="padding:4px;">
            <div style="font-size:13px; font-weight:700; color:#0284c7; margin-bottom:4px;">🚦 ${cp.name}</div>
            <div style="font-size:12px; font-weight:700; margin-bottom:6px; color:${state === 'clean' ? '#16a34a' : (state === 'danger' ? '#dc2626' : '#64748b')}">
              ${statusTitle}
            </div>
        `;

        if (latest) {
          const time = latest.time || latest.timestamp || 0;
          const diff = now - time;
          const remainingMs = Math.max(0, LIFETIME_MS - diff);
          const remMin = Math.floor(remainingMs / 60000);
          const remSec = Math.floor((remainingMs % 60000) / 1000);

          popupContent += `
            <div class="popup-text">${latest.text || ""}</div>
            <div class="popup-meta-row">
              <span>⏳ До зникнення:</span>
              <span class="popup-badge">${remMin}:${remSec.toString().padStart(2, '0')}</span>
            </div>
            <div class="popup-meta-row">
              <span>🕒 Додано:</span>
              <span>${new Date(time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
          `;
        } else {
          popupContent += `<div style="font-size:11px; color:#64748b;">(Світлофор у режимі очікування)</div>`;
        }

        if (isEditMode) {
          popupContent += `<button class="btn-delete-tl" onclick="deleteTrafficLight('${cp.id}')">🗑️ Видалити світлофор</button>`;
        }
        popupContent += `</div>`;

        if (trafficMarkersMap[cp.id]) {
          const marker = trafficMarkersMap[cp.id];
          marker.setIcon(tlIcon);
          marker.setPopupContent(popupContent);
          if (isEditMode) marker.dragging.enable();
          else marker.dragging.disable();
        } else {
          const marker = L.marker([cp.lat, cp.lng], {
            icon: tlIcon,
            zIndexOffset: 1000,
            draggable: isEditMode
          });

          marker.on('dragend', async function(e) {
            const newPos = e.target.getLatLng();
            cp.lat = Number(newPos.lat.toFixed(5));
            cp.lng = Number(newPos.lng.toFixed(5));
            await syncCheckpointsToCloud();
          });

          marker.bindPopup(popupContent);
          trafficLightLayer.addLayer(marker);
          trafficMarkersMap[cp.id] = marker;
        }
      });
    }

    /* ТОЧКИ: ЯРКИЕ КРУГИ С БЕЛЫМ ОБОДКОМ */
    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let visibleCount = 0;

      allPoints.forEach(p => {
        const time = p.time || p.timestamp || 0;
        const diff = now - time;
        if (diff > LIFETIME_MS) return;

        const isFresh = diff <= FRESH_THRESHOLD_MS;
        const clean = isCleanPoint(p);
        
        const colorClass = clean ? "color-green" : "color-red";
        const freshClass = isFresh ? "fresh" : "";
        const emoji = clean ? "🟢" : "🔴";

        const markerHtml = `<div class="radar-circle ${colorClass} ${freshClass}"></div>`;

        const dotIcon = L.divIcon({
          className: 'custom-dot-marker',
          html: markerHtml,
          iconSize: [18, 18],
          iconAnchor: [9, 9],
          popupAnchor: [0, -10]
        });

        const remainingMs = Math.max(0, LIFETIME_MS - diff);
        const remMinutes = Math.floor(remainingMs / 60000);
        const remSeconds = Math.floor((remainingMs % 60000) / 1000);

        const date = new Date(time);
        const dateStr = date.toLocaleDateString('uk-UA');
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        const popupContent = `
          <div class="popup-card">
            <div class="popup-text">${emoji} ${p.text || ""}</div>
            <div class="popup-meta-row">
              <span>⏳ До зникнення:</span>
              <span class="popup-badge">${remMinutes}:${remSeconds.toString().padStart(2, '0')}</span>
            </div>
            <div class="popup-meta-row">
              <span>🕒 Додано:</span>
              <span>${dateStr}, ${timeStr}</span>
            </div>
          </div>
        `;

        const marker = L.marker([p.lat, p.lng], { icon: dotIcon });
        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
        visibleCount++;
      });

      document.getElementById('countText').innerText = `Точок: ${visibleCount}`;
    }

    loadCheckpointsFromCloud().then(() => {
      loadNeonLines().then(() => {
        loadPoints();
      });
    });
    setInterval(loadPoints, 15000);
  </script>
</body>
</html>
