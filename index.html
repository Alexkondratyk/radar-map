<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Радар Дніпро</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #171b22;
    }
    #map {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #e5e3df;
      z-index: 1;
    }

    /* Верхня панель */
    .info-card {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.94);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      max-width: 320px;
      width: calc(100% - 32px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }
    .info-title {
      font-size: 15px;
      font-weight: 700;
    }
    .db-settings-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
    }
    .info-subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    /* Легенда маршрутів */
    .routes-legend {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
      font-size: 11px;
      padding: 7px 9px;
      background: rgba(15, 23, 42, 0.75);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .route-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
    }
    .route-line-badge {
      width: 22px;
      height: 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .badge-r1 { background: #0284c7; box-shadow: 0 0 6px #0284c7; }
    .badge-r2 { background: #d97706; box-shadow: 0 0 6px #d97706; }

    .filter-group {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr 1fr;
      gap: 5px;
    }
    .filter-btn {
      background: #334155;
      color: #e2e8f0;
      border: none;
      padding: 6px 0;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .filter-btn.active {
      background: #2563eb;
      color: #fff;
      font-weight: 600;
    }
    .filter-btn.route-btn.active {
      background: #f59e0b;
      color: #000;
      font-weight: 700;
    }

    /* Кнопка Оновити */
    .refresh-btn {
      position: absolute;
      bottom: 24px;
      right: 16px;
      z-index: 1000;
      background: rgba(23, 27, 34, 0.94);
      backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }
    .refresh-btn:active {
      transform: scale(0.94);
      background: #1e293b;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      gap: 12px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    .popup-content strong {
      display: block;
      color: #38bdf8;
      margin-bottom: 4px;
      font-size: 13px;
    }
    .popup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .badge-route-1 { background: #0284c7; color: #fff; }
    .badge-route-2 { background: #d97706; color: #fff; }
    .badge-route-both { background: #ec4899; color: #fff; }

    .popup-content p {
      font-size: 12px;
      margin-bottom: 6px;
      line-height: 1.35;
    }
    .popup-time {
      font-size: 11px;
      color: #94a3b8;
    }
    .error-banner {
      color: #f87171;
      font-size: 11px;
      margin-top: 6px;
      line-height: 1.3;
    }
    
    .endpoint-badge {
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      border: 1px solid #fff;
      white-space: nowrap;
    }
    .badge-start { background: #16a34a; }
    .badge-finish { background: #dc2626; }
  </style>
</head>
<body>

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div>Оновлення даних...</div>
  </div>

  <div class="info-card">
    <div class="info-header">
      <div class="info-title" id="points-title">Точок: 0</div>
      <button class="db-settings-btn" onclick="editDbUrl()" title="Налаштування посилання БД">⚙️</button>
    </div>
    <div class="info-subtitle">Маркери активні 2 години</div>

    <div class="routes-legend">
      <div class="route-item">
        <span class="route-line-badge badge-r1"></span>
        <span><b>М1:</b> Канатна 126 ➔ Павлова ➔ Белелюбського ➔ Свободи 203</span>
      </div>
      <div class="route-item">
        <span class="route-line-badge badge-r2"></span>
        <span><b>М2:</b> Канатна 126 ➔ Озерка ➔ Речпорт ➔ Свободи 203</span>
      </div>
    </div>

    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">Всі</button>
      <button class="filter-btn route-btn" onclick="setFilter('route', this)">Маршрути</button>
      <button class="filter-btn" onclick="setFilter('1', this)">К 1</button>
      <button class="filter-btn" onclick="setFilter('2', this)">К 2</button>
    </div>
    <div id="db-error" class="error-banner" style="display:none;"></div>
  </div>

  <button id="refresh-btn" class="refresh-btn" onclick="triggerReload()">🔄 Оновити</button>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let DB_URL = localStorage.getItem('user_db_url') || 'https://dnepr-radar-default-rtdb.europe-west1.firebasedatabase.app/points.json';

    const TTL_MS = 120 * 60 * 1000;
    let currentFilter = 'all';
    let rawPoints = [];

    const map = L.map('map', {
      zoomControl: false
    }).setView([48.479, 34.975], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);

    // ==============================================================
    // ТОЧНІ ТРАЄКТОРІЇ ВІД КАНАТНОЇ 126 ДО ПР. СВОБОДИ 203
    // ==============================================================

    const START_POINT = [48.4638, 35.0085]; // вул. Канатна, 126
    const FINISH_POINT = [48.4892, 34.9405]; // пр. Свободи, 203 (Новокодацька площа)

    // МАРШРУТ 1 (Промзона): Канатна 126 -> Щепкіна -> пр. Нігояна -> Павлова -> Белелюбського -> Ударників (Комбайн) -> Водолікарня -> пр. Свободи, 203
    const route1StreetPath = [
      START_POINT,
      [48.4655, 35.0070], // виїзд з Канатної на Щепкіна
      [48.4685, 35.0055], // вул. Щепкіна
      [48.4715, 35.0042], // спуск по Щепкіна до Нігояна
      [48.4735, 35.0035], // виїзд на пр. Сергія Нігояна
      [48.4752, 35.0050], // пр. Сергія Нігояна
      [48.4768, 35.0068], // поворот на вул. Академіка Павлова
      [48.4795, 35.0072], // вул. Академіка Павлова
      [48.4825, 35.0068], // спуск по Павлова
      [48.4828, 35.0040], // поворот ліворуч на Белелюбського
      [48.4834, 34.9980], // вул. Белелюбського
      [48.4836, 34.9915], // вул. Белелюбського вздовж колій
      [48.4830, 34.9845], // плавний перехід у вул. Ударників
      [48.4822, 34.9790], // вул. Ударників (Комбайновий завод)
      [48.4812, 34.9715], // вул. Ударників вздовж заводського паркану
      [48.4798, 34.9635], // вул. Ударників до Водолікарні
      [48.4792, 34.9608], // Водолікарня (початок пр. Свободи, 2-А)
      [48.4805, 34.9560], // пр. Свободи
      [48.4822, 34.9520], // пр. Свободи (станція метро)
      [48.4845, 34.9480], // пр. Свободи
      [48.4870, 34.9440], // пр. Свободи біля парку Новокодацький
      FINISH_POINT        // Фініш: пр. Свободи, 203
    ];

    // МАРШРУТ 2 (Набережна): Канатна 126 -> Озерка -> Княгині Ольги -> Речпорт -> Набережна Заводська -> Водокачка -> пр. Свободи, 203
    const route2StreetPath = [
      START_POINT,
      [48.4650, 35.0140], // по Канатній
      [48.4662, 35.0195], // по Канатній в бік Озерки
      [48.4675, 35.0235], // вихід на вул. Шмідта
      [48.4688, 35.0252], // ринок Озерка / вул. Боброва
      [48.4725, 35.0268], // перетин з пр. Яворницького / вул. Княгині Ольги
      [48.4765, 35.0295], // по вул. Княгині Ольги до набережної
      [48.4810, 35.0322], // Речпорт / пл. Десантників
      [48.4830, 35.0250], // виїзд на Набережну Заводську
      [48.4850, 35.0130], // Набережна Заводська
      [48.4868, 34.9980], // Набережна Заводська
      [48.4880, 34.9820], // Набережна Заводська
      [48.4892, 34.9670], // Набережна Заводська
      [48.4905, 34.9550], // під Кайдацьким мостом
      [48.4925, 34.9460], // Водокачка (насосна станція)
      [48.4918, 34.9430], // з'їзд з Набережної
      [48.4905, 34.9415], // вихід на пр. Свободи
      FINISH_POINT        // Фініш: пр. Свободи, 203
    ];

    // Малювання ліній
    L.polyline(route1StreetPath, { color: '#0f172a', weight: 8, opacity: 0.75 }).addTo(map);
    L.polyline(route1StreetPath, {
      color: '#0284c7',
      weight: 5,
      opacity: 0.95,
      dashArray: '8, 6',
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    L.polyline(route2StreetPath, { color: '#0f172a', weight: 8, opacity: 0.75 }).addTo(map);
    L.polyline(route2StreetPath, {
      color: '#d97706',
      weight: 5,
      opacity: 0.95,
      dashArray: '8, 6',
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    // Мітки старту та фінішу
    L.marker(START_POINT, {
      icon: L.divIcon({
        className: 'custom-pin',
        html: '<div class="endpoint-badge badge-start">🏠 Старт: Канатна, 126</div>',
        iconSize: [140, 24],
        iconAnchor: [70, 12]
      })
    }).addTo(map);

    L.marker(FINISH_POINT, {
      icon: L.divIcon({
        className: 'custom-pin',
        html: '<div class="endpoint-badge badge-finish">🏁 Фініш: Свободи, 203</div>',
        iconSize: [140, 24],
        iconAnchor: [70, 12]
      })
    }).addTo(map);

    const ROUTE_1_KEYWORDS = ['канатн', 'нігоян', 'нигоян', 'калінін', 'калинин', 'щепкін', 'щепкин', 'павлов', 'белелюб', 'краснозавод', 'комбайн', 'ударник', 'водолікарн', 'водолечебн', 'маяковськ', 'маяковск', 'свобод', 'новокодацьк'];
    const ROUTE_2_KEYWORDS = ['канатн', 'озерк', 'шмідт', 'шмидт', 'бобров', 'річпорт', 'речпорт', 'десантник', 'княгині ольги', 'княгини ольги', 'пастер', 'набережн.*заводськ', 'заводськ', 'заводск', 'водокачк', 'кайдак', 'свобод'];

    function triggerReload() {
      const overlay = document.getElementById('loading-overlay');
      const btn = document.getElementById('refresh-btn');
      
      btn.innerHTML = '⏳ Оновлюю...';
      btn.style.pointerEvents = 'none';
      overlay.style.display = 'flex';

      setTimeout(() => {
        const url = new URL(window.location.href);
        url.searchParams.set('t', Date.now());
        window.location.href = url.toString();
      }, 250);
    }

    function editDbUrl() {
      const current = localStorage.getItem('user_db_url') || DB_URL;
      const input = prompt('Введіть повний URL вашої бази Firebase (з /points.json на кінці):', current);
      if (input && input.trim().startsWith('http')) {
        localStorage.setItem('user_db_url', input.trim());
        DB_URL = input.trim();
        triggerReload();
      }
    }

    function parseTimestamp(p) {
      let t = p.timestamp || p.time || p.date;
      if (!t) return Date.now();
      if (typeof t === 'string' && !isNaN(t)) t = Number(t);
      if (typeof t === 'number' && t < 1e11) t *= 1000;
      const parsed = new Date(t).getTime();
      return isNaN(parsed) ? Date.now() : parsed;
    }

    function formatExactTime(timestamp) {
      try {
        const date = new Date(timestamp);
        return date.toLocaleTimeString('uk-UA', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
          timeZone: 'Europe/Kyiv'
        });
      } catch (e) {
        return '';
      }
    }

    function isStatusClear(p, text) {
      const typeStr = String(p.type || '').toLowerCase().trim();
      if (typeStr === 'clear' || typeStr === 'clean' || typeStr === 'safe' || typeStr === 'чисто') {
        return true;
      }
      const lowerText = String(text || '').toLowerCase();
      const clearMarkers = ['чисто', 'чист', 'спокійно', 'спокойно', 'тихо', 'сонячно', 'солнечно', '☀️', 'проїзд', 'проезд', 'ведра нет', 'відра нема'];
      return clearMarkers.some(word => lowerText.includes(word));
    }

    function checkRouteMembership(p, text) {
      const combined = `${p.address || ''} ${text || ''}`.toLowerCase();
      const isR1 = ROUTE_1_KEYWORDS.some(kw => new RegExp(kw).test(combined));
      const isR2 = ROUTE_2_KEYWORDS.some(kw => new RegExp(kw).test(combined));
      if (isR1 && isR2) return 'both';
      if (isR1) return 'r1';
      if (isR2) return 'r2';
      return null;
    }

    function getMarkerColor(pChannel, isClear) {
      if (pChannel === '2') {
        return isClear ? '#eab308' : '#a855f7';
      } else {
        return isClear ? '#22c55e' : '#ef4444';
      }
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let count = 0;

      rawPoints.forEach(p => {
        if (!p) return;
        const pTime = parseTimestamp(p);
        
        if (now - pTime > TTL_MS) return;

        let pChannel = '1';
        if (p.channel === 2 || p.channel === '2' || p.channel === 'channel2') {
          pChannel = '2';
        }

        const pointText = p.text || p.message || p.description || p.raw_text || p.original_text || p.details || 'Без опису';
        const routeType = checkRouteMembership(p, pointText);

        if (currentFilter === 'route' && !routeType) return;
        if (currentFilter === '1' && pChannel !== '1') return;
        if (currentFilter === '2' && pChannel !== '2') return;

        const lat = parseFloat(p.lat);
        const lng = parseFloat(p.lng);
        if (isNaN(lat) || isNaN(lng)) return;

        const isClear = isStatusClear(p, pointText);
        const color = getMarkerColor(pChannel, isClear);

        let strokeColor = '#ffffff';
        let strokeWidth = 2;
        let radius = 8;

        if (routeType === 'r1') {
          strokeColor = '#0284c7';
          strokeWidth = 4;
          radius = 12;
        } else if (routeType === 'r2') {
          strokeColor = '#d97706';
          strokeWidth = 4;
          radius = 12;
        } else if (routeType === 'both') {
          strokeColor = '#ec4899';
          strokeWidth = 5;
          radius = 13;
        }

        const circle = L.circleMarker([lat, lng], {
          radius: radius,
          fillColor: color,
          color: strokeColor,
          weight: strokeWidth,
          opacity: 1,
          fillOpacity: 0.95
        });

        const exactTime = formatExactTime(pTime);
        
        let badgeHtml = '';
        if (routeType === 'r1') badgeHtml = '<div class="popup-badge badge-route-1">📍 Маршрут 1 (Промзона)</div>';
        if (routeType === 'r2') badgeHtml = '<div class="popup-badge badge-route-2">📍 Маршрут 2 (Набережна)</div>';
        if (routeType === 'both') badgeHtml = '<div class="popup-badge badge-route-both">📍 Спільна точка (М1 + М2)</div>';

        circle.bindPopup(`
          <div class="popup-content">
            ${badgeHtml}
            <strong>${p.address || 'Точка на карті'}</strong>
            <p>${pointText}</p>
            <div class="popup-time">🕒 ${exactTime} | Канал ${pChannel}</div>
          </div>
        `);

        circle.addTo(markersLayer);
        count++;
      });

      document.getElementById('points-title').innerText = `Точок: ${count}`;
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      renderMarkers();
    }

    async function loadData() {
      const errBox = document.getElementById('db-error');
      try {
        const res = await fetch(`${DB_URL}?nocache=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        rawPoints = data ? Object.values(data) : [];
        errBox.style.display = 'none';
        renderMarkers();
      } catch (err) {
        console.error(err);
        errBox.style.display = 'block';
        errBox.innerHTML = `⚠️ Помилка з'єднання з БД.<br>Натисніть ⚙️ вище і перевірте адресу.`;
      }
    }

    loadData();
  </script>
</body>
</html>
