<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Радар Дніпро</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* Панель управления */
    .dashboard {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(8px);
      padding: 12px 16px;
      border-radius: 12px;
      color: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      min-width: 220px;
    }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .points-count { font-size: 16px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 6px; margin-bottom: 8px; }
    .btn-filter {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-filter.active { background: #2563eb; color: #fff; border-color: #2563eb; }

    /* Легенда цветов */
    .legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: #94a3b8;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .legend-row { display: flex; align-items: center; gap: 6px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #22c55e; }
    .dot-red { background: #ef4444; }
    .dot-blue { background: #06b6d4; }
    .dot-purple { background: #a855f7; }

    /* Кнопка ручного обновления */
    .btn-refresh {
      position: absolute;
      bottom: 25px;
      right: 20px;
      z-index: 1000;
      background: #0f172a;
      color: #fff;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .btn-refresh:hover { background: #1e293b; }

    /* Всплывающее окно метки */
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      color: #f8fafc !important;
      border-radius: 10px !important;
      padding: 4px !important;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: #1e293b !important; }
    .popup-title { font-size: 14px; font-weight: 700; color: #38bdf8; margin-bottom: 4px; }
    .popup-text { font-size: 13px; margin-bottom: 8px; line-height: 1.4; color: #e2e8f0; }
    .popup-meta {
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #334155;
      padding-top: 6px;
      gap: 10px;
    }
    .timer-badge { color: #f59e0b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="dashboard">
    <div class="dash-header">
      <div class="points-count" id="countText">Точок: 0</div>
    </div>
    <div class="subtitle">Маркери активні 40 хвилин</div>
    <div class="btn-group">
      <button class="btn-filter active" onclick="setFilter('all', this)">Всі</button>
      <button class="btn-filter" onclick="setFilter('dnepr_bez_tck', this)">Канал 1</button>
      <button class="btn-filter" onclick="setFilter('agendaDnepr', this)">Канал 2</button>
    </div>
    <div class="legend">
      <div class="legend-row">
        <span class="dot dot-green"></span><span class="dot dot-red"></span>
        <span>К1: Чисто / Опасно</span>
      </div>
      <div class="legend-row">
        <span class="dot dot-blue"></span><span class="dot dot-purple"></span>
        <span>К2: Чисто / Опасно</span>
      </div>
    </div>
  </div>

  <button class="btn-refresh" onclick="loadPoints()">🔄 Оновити</button>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const FIREBASE_URL = "https://dnepr-radar-2026-alexx-default-rtdb.europe-west1.firebasedatabase.app/points.json";
    const LIFETIME_MS = 40 * 60 * 1000; // 40 минут

    const map = L.map('map', { zoomControl: false }).setView([48.4647, 35.0462], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markersLayer = L.layerGroup().addTo(map);
    let allPoints = [];
    let currentFilter = 'all';

    function setFilter(type, btn) {
      document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = type;
      renderMarkers();
    }

    async function loadPoints() {
      try {
        const res = await fetch(`${FIREBASE_URL}?t=${Date.now()}`);
        if (!res.ok) return;
        const data = await res.json();
        if (!data) {
          allPoints = [];
          renderMarkers();
          return;
        }

        const now = Date.now();
        allPoints = Object.values(data).filter(p => {
          if (!p || typeof p !== 'object' || !p.lat || !p.lng) return false;
          const time = p.time || p.timestamp || 0;
          return (now - time) <= LIFETIME_MS;
        });

        renderMarkers();
      } catch (err) {
        console.error("Помилка завантаження точок:", err);
      }
    }

    function getMarkerColor(p) {
      if (p.color === "green") return "#22c55e";
      if (p.color === "red") return "#ef4444";
      if (p.color === "blue") return "#06b6d4";
      if (p.color === "purple") return "#a855f7";

      // Резервное определение для старых записей
      const isClean = (p.status === "чисто") || (p.text && p.text.toLowerCase().includes("чисто"));
      if (p.source === "agendaDnepr") {
        return isClean ? "#06b6d4" : "#a855f7";
      }
      return isClean ? "#22c55e" : "#ef4444";
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      const now = Date.now();
      let visibleCount = 0;

      allPoints.forEach(p => {
        const time = p.time || p.timestamp || 0;
        const diff = now - time;
        if (diff > LIFETIME_MS) return;

        // Фильтрация
        if (currentFilter !== 'all' && p.source !== currentFilter) return;

        // Расчёт времени до удаления
        const remainingMs = Math.max(0, LIFETIME_MS - diff);
        const remMinutes = Math.floor(remainingMs / 60000);
        const remSeconds = Math.floor((remainingMs % 60000) / 1000);

        const date = new Date(time);
        const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const channelTitle = p.source === "agendaDnepr" ? "Канал 2" : "Канал 1";
        const markerColor = getMarkerColor(p);

        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 9,
          fillColor: markerColor,
          color: "#ffffff",
          weight: 2,
          opacity: 1,
          fillOpacity: 0.95
        });

        const popupContent = `
          <div class="popup-title">${p.address || "Дніпро"}</div>
          <div class="popup-text">${p.text || ""}</div>
          <div class="popup-meta">
            <span>🕒 ${timeStr} | ${channelTitle}</span>
            <span class="timer-badge">⏳ До видалення: ${remMinutes} хв ${remSeconds} с</span>
          </div>
        `;

        marker.bindPopup(popupContent);
        markersLayer.addLayer(marker);
        visibleCount++;
      });

      document.getElementById('countText').innerText = `Точок: ${visibleCount}`;
    }

    // Первичный запуск
    loadPoints();

    // Автообновление каждые 15 секунд без нажатия F5
    setInterval(loadPoints, 15000);
  </script>
</body>
</html>
