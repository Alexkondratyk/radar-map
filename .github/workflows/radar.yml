name: Radar 24/7 Sync

on:
  schedule:
    # Запуск каждые 12 минут с 05:00 до 21:00 по будням (Пн-Пт)
    - cron: '*/12 2-18 * * 1-5'
  workflow_dispatch: # Оставляет кнопку для ручного запуска в любое время

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: pip install requests

      - name: Запуск радара
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python radar.py
