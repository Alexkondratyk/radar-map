name: Radar 24/7 Sync

on:
  workflow_dispatch: # Запуск вручну та за запитом кнопки з веб-карти
  schedule:
    - cron: '0 */5 * * *' # Автоматичний перезапуск кожні 5 годин 24/7 (за часом UTC)

concurrency:
  group: radar-runner
  cancel-in-progress: true # Якщо ви натиснете кнопку на карті, попередній завислий процес завершиться на користь нового

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Максимальний ліміт GitHub Actions (6 годин)

    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4

      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Встановлення бібліотек
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Запуск радара
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python radar.py
